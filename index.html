    h += '<button class="btn primary" data-act="' + (last ? 'drawer' : 'next') + '">' + (last ? 'Review &amp; finish' : 'Next') + '</button>';
  }
  h += '</div></div>';
  if (S.drawer) h += renderDrawer();
  return h;
}

function cellClass(id, i){
  var s = S.session, c = 'cell';
  var sel = s.answers[id] || [];
  if (S.view === 'review' || (s.mode === 'practice' && s.revealed[id]) || s.finished){
    if (sel.length || s.finished){ var r = scoreQ(BY[id], sel); c += r.exact ? ' ok' : (r.pts > 0 ? ' part' : (sel.length || s.finished ? ' bad' : '')); }
  } else if (sel.length) c += ' ans';
  if (s.flagged[id]) c += ' fl';
  if (S.view === 'quiz' && i === s.idx) c += ' cur';
  if (S.view === 'review' && S.reviewList[S.reviewPos] === id) c += ' cur';
  return c;
}
function renderDrawer(){
  var s = S.session, isPractice = s.mode === 'practice';
  var unanswered = s.ids.filter(function(id){ return !(s.answers[id]||[]).length; }).length;
  var flagged = s.ids.filter(function(id){ return s.flagged[id]; }).length;
  var h = '<div class="scrim" data-act="closedrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Question navigator">';
  h += '<div class="drawer-h"><h2>Questions</h2><button class="btn small ghost" data-act="closedrawer">Close</button></div><div class="drawer-b">';
  if (S.view === 'review' || isPractice) h += '<div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>Correct</span><span><i style="background:var(--miss-soft);border-color:var(--miss)"></i>Partial</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Incorrect</span><span><i></i>Not yet</span></div>';
  else h += '<div class="legend"><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>Answered</span><span><i></i>Unanswered</span><span><i style="border-color:var(--flag)"></i>Flagged dot</span></div>';
  h += '<div class="grid">';
  var list = S.view === 'review' ? S.reviewList : s.ids;
  list.forEach(function(id){ var i = s.ids.indexOf(id); h += '<button class="' + cellClass(id, i) + '" data-act="goto" data-v="' + i + '" aria-label="Question ' + (i+1) + '">' + (i+1) + '</button>'; });
  h += '</div>';
  if (S.view === 'quiz'){
    h += '<div class="finish">';
    if (isPractice){
      var done = s.ids.filter(function(x){ return s.revealed[x]; }).length;
      h += '<p>' + done + ' of ' + s.ids.length + ' submitted. Ending now scores only the questions you submitted.</p>';
    } else {
      h += '<p>' + (s.ids.length - unanswered) + ' of ' + s.ids.length + ' answered' + (flagged ? ' · ' + flagged + ' flagged' : '') + '.</p>';
    }
    if (S.confirm === 'finish'){
      h += '<div class="confirm"><p><strong>' + (unanswered && !isPractice ? unanswered + ' unanswered question' + (unanswered === 1 ? '' : 's') + ' will be scored as incorrect.' : 'You won\'t be able to change answers after this.') + '</strong></p><div class="row"><button class="btn primary" data-act="finishyes">' + (isPractice ? 'End practice' : 'Submit exam') + '</button><button class="btn" data-act="cancelconfirm">Keep working</button></div></div>';
    } else {
      h += '<button class="btn primary" data-act="finish">' + (isPractice ? 'End practice and see results' : 'Submit exam') + '</button>';
    }
    h += '</div>';
  }
  h += '</div></aside>';
  return h;
}

function scoredIds(){
  var s = S.session;
  return s.mode === 'exam' ? s.ids.slice() : s.ids.filter(function(id){ return s.revealed[id]; });
}
function renderResults(){
  var s = S.session, ids = scoredIds();
  var h = '<main class="wrap results">';
  var dur = fmtTime(s.elapsed);
  h += '<div><p class="eyebrow">' + (s.mode === 'exam' ? 'Exam' : 'Practice') + ' complete · ' + dur + '</p><h1 style="font-size:clamp(1.8rem,5vw,2.4rem);margin-top:.4rem">Your score report</h1></div>';
  if (!ids.length){
    h += '<p class="empty">No questions were submitted in this session.</p><div class="res-actions"><button class="btn primary" data-act="home">Back to start</button></div></main>';
    return h;
  }
  var tot = 0, pts = 0, max = 0, sata = [0,0], mc = [0,0], unans = 0, byT = {}, byC = {};
  ids.forEach(function(id){
    var q = BY[id], r = scoreQ(q, s.answers[id]);
    if (r.exact) tot++; pts += r.pts; max += r.max; if (!r.answered) unans++;
    var b = q.type === 'sata' ? sata : mc; b[1]++; if (r.exact) b[0]++;
    byT[q.topic] = byT[q.topic] || [0,0]; byT[q.topic][1]++; if (r.exact) byT[q.topic][0]++;
    byC[q.cj] = byC[q.cj] || [0,0]; byC[q.cj][1]++; if (r.exact) byC[q.cj][0]++;
  });
  var P = pct(tot, ids.length);
  h += '<div class="scorebox"><div class="big">' + P + '<small>%</small></div><div class="scoredet"><p><strong>' + tot + ' of ' + ids.length + '</strong> items fully correct</p><p>NGN +/- points <strong>' + pts + ' of ' + max + '</strong> (' + pct(pts,max) + '%)</p>' + (unans ? '<p>' + unans + ' left unanswered</p>' : '') + '<p>' + (P >= 80 ? 'Strong work. Review the misses below to lock it in.' : P >= 60 ? 'Solid base. Your weakest topics are listed first below.' : 'Keep going. Start with the topics at the top of the list below.') + '</p></div></div>';
  h += '<div class="stats">';
  h += '<div class="stat"><span class="l">Select all that apply</span><span class="v">' + pct(sata[0],sata[1]) + '%</span><span class="s">' + sata[0] + ' of ' + sata[1] + '</span></div>';
  h += '<div class="stat"><span class="l">Multiple choice</span><span class="v">' + pct(mc[0],mc[1]) + '%</span><span class="s">' + mc[0] + ' of ' + mc[1] + '</span></div>';
  h += '<div class="stat"><span class="l">Time</span><span class="v">' + dur + '</span><span class="s">' + fmtTime(s.elapsed/ids.length) + ' per item</span></div>';
  h += '</div>';
  var tr = Object.keys(byT).map(function(t){ return [t, byT[t][0], byT[t][1]]; }).sort(function(a,b){ return (a[1]/a[2]) - (b[1]/b[2]) || b[2]-a[2]; });
  h += '<section><h2 class="sub">By topic <span class="eyebrow" style="display:inline;margin-left:.4rem">weakest first</span></h2></section><div class="bars">';
  tr.forEach(function(r){ var p = pct(r[1], r[2]); h += '<div class="brow"><span class="bn">' + esc(r[0]) + '</span><span class="track"><i class="' + band(p) + '" style="width:' + Math.max(p,2) + '%"></i></span><span class="bv">' + r[1] + '/' + r[2] + '</span></div>'; });
  h += '</div>';
  h += '<section><h2 class="sub">By clinical judgment step</h2></section><div class="bars">';
  CJ_ORDER.forEach(function(c){ if (!byC[c]) return; var p = pct(byC[c][0], byC[c][1]); h += '<div class="brow"><span class="bn">' + c + '</span><span class="track"><i class="' + band(p) + '" style="width:' + Math.max(p,2) + '%"></i></span><span class="bv">' + byC[c][0] + '/' + byC[c][1] + '</span></div>'; });
  h += '</div>';
  var missN = ids.filter(function(id){ return !scoreQ(BY[id], s.answers[id]).exact; }).length;
  h += '<div class="res-actions"><button class="btn primary" data-act="review" data-v="all">Review every answer</button>' + (missN ? '<button class="btn" data-act="review" data-v="missed">Review ' + missN + ' missed</button><button class="btn" data-act="retrymissed">Practice these ' + missN + ' again</button>' : '') + '<button class="btn ghost" data-act="home">Back to start</button></div>';
  h += '</main>';
  return h;
}

function renderReview(){
  var s = S.session, list = S.reviewList, id = list[S.reviewPos], i = s.ids.indexOf(id);
  var title = '<span class="pill">Review</span><span class="qcount"><b>' + (S.reviewPos+1) + '</b> of ' + list.length + (S.reviewFilter === 'missed' ? ' missed' : '') + '</span>';
  var extra = '<button class="btn small" data-act="drawer">Questions</button><button class="btn small ghost" data-act="toresults"><span class="lg">Score report</span><span class="sm">Report</span></button>';
  var h = renderBar(title, extra);
  h += '<main class="wrap quiz">' + renderQuestionCard(id, i+1, s.ids.length, true) + '</main>';
  h += '<div class="actions"><div class="wrap actions-in"><button class="btn" data-act="rprev"' + (S.reviewPos === 0 ? ' disabled' : '') + '>Back</button><span class="spacer"></span><span class="kbd-hint">Arrow keys to move</span>';
  h += S.reviewPos < list.length-1 ? '<button class="btn primary" data-act="rnext">Next</button>' : '<button class="btn primary" data-act="toresults">Back to score report</button>';
  h += '</div></div>';
  if (S.drawer) h += renderDrawer();
  return h;
}

var app = document.getElementById('app');
function render(){
  var html;
  if (S.view === 'quiz' && S.session && !S.session.finished) html = renderQuiz();
  else if (S.view === 'results' && S.session && S.session.finished) html = renderResults();
  else if (S.view === 'review' && S.session && S.reviewList && S.reviewList.length) html = renderReview();
  else { S.view = 'home'; html = renderHome(); }
  app.innerHTML = html;
  document.body.style.overflow = S.drawer ? 'hidden' : '';
}

/* ── actions ── */
function toggleOpt(oi){
  var s = S.session, id = curId(), q = BY[id];
  if (s.mode === 'practice' && s.revealed[id]) return;
  var sel = (s.answers[id] || []).slice();
  if (q.type === 'mc') sel = [oi];
  else { var k = sel.indexOf(oi); if (k >= 0) sel.splice(k,1); else sel.push(oi); }
  s.answers[id] = sel;
  persist(); render();
}
function submitPractice(){
  var s = S.session, id = curId();
  if (!(s.answers[id]||[]).length || s.revealed[id]) return;
  s.revealed[id] = true;
  var r = scoreQ(BY[id], s.answers[id]);
  var hh = S.history[id] || { seen:0, correct:0 }; hh.seen++; if (r.exact) hh.correct++; hh.last = r.exact; S.history[id] = hh;
  persist(); render();
}
function go(i){ var s = S.session; if (i < 0 || i >= s.ids.length) return; s.idx = i; S.drawer = false; S.confirm = null; persist(); render(); window.scrollTo(0,0); }
function startReview(filter){
  var s = S.session, ids = scoredIds();
  S.reviewFilter = filter;
  S.reviewList = filter === 'missed' ? ids.filter(function(id){ return !scoreQ(BY[id], s.answers[id]).exact; }) : ids;
  if (!S.reviewList.length) return;
  S.reviewPos = 0; S.view = 'review'; S.drawer = false; render(); window.scrollTo(0,0);
}

app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var a = el.getAttribute('data-act'), v = el.getAttribute('data-v'), p = S.prefs;
  switch (a){
    case 'mode': p.mode = v; break;
    case 'topic': var k = p.topics.indexOf(v); if (k >= 0) p.topics.splice(k,1); else p.topics.push(v); break;
    case 'sysall':
      var allOn = TOPICS[v].every(function(t){ return p.topics.indexOf(t) >= 0; });
      p.topics = p.topics.filter(function(t){ return TOPICS[v].indexOf(t) < 0; });
      if (!allOn) p.topics = p.topics.concat(TOPICS[v]);
      break;
    case 'qtype': p.qtype = v; break;
    case 'count': p.count = v; break;
    case 'pref': p[v] = !p[v]; break;
    case 'start': stopClock(); newSession(p.mode, pool()); return;
    case 'startmissed': stopClock(); S._forceAll = true; newSession('practice', missedIds()); return;
    case 'retrymissed':
      var s0 = S.session, miss = scoredIds().filter(function(id){ return !scoreQ(BY[id], s0.answers[id]).exact; });
      S._forceAll = true; newSession('practice', miss); return;
    case 'resume': S.view = 'quiz'; S.confirm = null; startClock(); render(); window.scrollTo(0,0); return;
    case 'discard': stopClock(); S.session = null; break;
    case 'toresults': S.view = 'results'; S.drawer = false; render(); window.scrollTo(0,0); persist(); return;
    case 'home': S.view = 'home'; S.drawer = false; S.confirm = null; break;
    case 'reset': S.confirm = 'reset'; break;
    case 'resetyes': S.history = {}; if (S.session && S.session.finished) S.session = null; S.confirm = null; break;
    case 'cancelconfirm': S.confirm = null; break;
    case 'opt': toggleOpt(+el.getAttribute('data-i')); return;
    case 'submit': submitPractice(); return;
    case 'next': go(S.session.idx + 1); return;
    case 'prev': go(S.session.idx - 1); return;
    case 'flag': var id = curId(); S.session.flagged[id] = !S.session.flagged[id]; break;
    case 'drawer': S.drawer = true; S.confirm = null; break;
    case 'closedrawer': S.drawer = false; S.confirm = null; break;
    case 'goto':
      if (S.view === 'review'){ var gid = S.session.ids[+v]; var pos = S.reviewList.indexOf(gid); if (pos >= 0){ S.reviewPos = pos; S.drawer = false; render(); window.scrollTo(0,0); } return; }
      go(+v); return;
    case 'finish': S.confirm = 'finish'; break;
    case 'finishyes': finishSession(); return;
    case 'exit': syncClock(); stopClock(); S.view = 'home'; S.drawer = false; break;
    case 'review': startReview(v); return;
    case 'rnext': if (S.reviewPos < S.reviewList.length-1){ S.reviewPos++; render(); window.scrollTo(0,0); } return;
    case 'rprev': if (S.reviewPos > 0){ S.reviewPos--; render(); window.scrollTo(0,0); } return;
    default: return;
  }
  persist(); render();
});

document.addEventListener('keydown', function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.drawer){ if (e.key === 'Escape'){ S.drawer = false; S.confirm = null; render(); } return; }
  if (S.view === 'quiz' && S.session){
    var s = S.session, id = curId(), order = s.optOrder[id], key = e.key.toLowerCase();
    var pos = 'abcdef'.indexOf(key); if (pos < 0 && /^[1-6]$/.test(key)) pos = +key - 1;
    if (pos >= 0 && pos < order.length && key.length === 1){ e.preventDefault(); toggleOpt(order[pos]); return; }
    if (e.key === 'Enter'){
      if (e.target && e.target.closest && e.target.closest('button') && !e.target.closest('.opt')) return;
      e.preventDefault();
      if (s.mode === 'practice' && !s.revealed[id]) submitPractice();
      else if (s.idx < s.ids.length-1) go(s.idx+1);
      else { S.drawer = true; render(); }
      return;
    }
    if (e.key === 'ArrowRight' && (s.mode === 'exam' || s.revealed[id])){ if (s.idx < s.ids.length-1) go(s.idx+1); return; }
    if (e.key === 'ArrowLeft'){ if (s.idx > 0) go(s.idx-1); return; }
  } else if (S.view === 'review'){
    if (e.key === 'ArrowRight' && S.reviewPos < S.reviewList.length-1){ S.reviewPos++; render(); window.scrollTo(0,0); }
    if (e.key === 'ArrowLeft' && S.reviewPos > 0){ S.reviewPos--; render(); window.scrollTo(0,0); }
  }
});
document.addEventListener('visibilitychange', function(){ if (document.hidden) persist(); });
window.addEventListener('pagehide', persist);

function snapshot(){ syncClock(); return { prefs:S.prefs, session:S.session, history:S.history, view:S.view, reviewList:S.reviewList, reviewPos:S.reviewPos, reviewFilter:S.reviewFilter }; }
function start(data){
  restore(data && data.session !== undefined ? data : null);
  if (S.view === 'quiz' && S.session && !S.session.finished) startClock(); else if (S.view === 'quiz') S.view = 'home';
  render();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(snapshot); } catch(e){}
var hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
</body>
</html>
