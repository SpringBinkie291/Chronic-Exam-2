<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuro & Sensory NCLEX Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: one focused testing column (max 46rem) under a sticky status bar, with an Amsler-grid card on the start screen. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F7F7; --ink:#16202A; --ink-2:#3B4752; --muted:#63707B; --rule:#D2DAD9; --grid:#D9E1E0;
  --accent:#2A45B0; --accent-ink:#FFFFFF; --accent-soft:#E6EBFB; --hilite:#EAF5A2;
  --ok:#17744B; --ok-soft:#E1F2E9; --bad:#B3261E; --bad-soft:#FBEAE8; --miss:#8F5400; --miss-soft:#FCF0D8; --flag:#C2410C;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 6px 24px -12px rgba(22,32,42,.18);
  --f-display:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1316; --surface:#161D22; --surface-2:#1C252B; --ink:#E4EBEE; --ink-2:#C1CBD1; --muted:#8D99A3; --rule:#2B363E; --grid:#222C33;
  --accent:#93A8FF; --accent-ink:#0E1316; --accent-soft:#1E2748; --hilite:#3B4714;
  --ok:#5ED39C; --ok-soft:#11301F; --bad:#FF8B80; --bad-soft:#3A1815; --miss:#F2B652; --miss-soft:#33270D; --flag:#FB923C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1316; --surface:#161D22; --surface-2:#1C252B; --ink:#E4EBEE; --ink-2:#C1CBD1; --muted:#8D99A3; --rule:#2B363E; --grid:#222C33;
  --accent:#93A8FF; --accent-ink:#0E1316; --accent-soft:#1E2748; --hilite:#3B4714;
  --ok:#5ED39C; --ok-soft:#11301F; --bad:#FF8B80; --bad-soft:#3A1815; --miss:#F2B652; --miss-soft:#33270D; --flag:#FB923C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:46rem;margin:0 auto;padding-inline:16px}
.wrap-wide{max-width:60rem;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:.6rem 1.1rem;font-weight:700;cursor:pointer;min-height:44px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.big{padding:.85rem 1.5rem;font-size:1.05rem}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:.35rem .85rem;font-size:.9rem}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:.25rem 0;text-decoration:underline;text-underline-offset:3px}

/* ── start screen ── */
.mast{padding-block:2.25rem 1.5rem}
.mast-in{display:grid;grid-template-columns:minmax(0,1fr) 15rem;gap:2rem;align-items:center}
.mast h1{font-size:clamp(2rem,5.2vw,3.1rem);margin:.5rem 0 .75rem;letter-spacing:-.01em}
.lede{color:var(--ink-2);max-width:38rem;margin:0;font-size:1.05rem}
.amsler{position:relative;aspect-ratio:1;max-width:100%;border:1.5px solid var(--ink);border-radius:4px;background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:10% 10%;background-position:-1px -1px;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"a ." "b c";padding:.6rem;box-shadow:var(--shadow)}
.am-stat{display:flex;flex-direction:column;gap:.15rem;background:var(--surface);padding:.25rem .45rem;border-radius:4px}
.am-stat:nth-child(1){grid-area:a;align-self:start;justify-self:start}
.am-stat:nth-child(2){grid-area:b;align-self:end;justify-self:start}
.am-stat:nth-child(3){grid-area:c;align-self:end;justify-self:end}
.am-stat b{font-family:var(--f-display);font-size:2rem;line-height:1}
.am-stat span{font-size:.8rem;color:var(--ink-2);line-height:1.2}
.am-dot{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ink)}
.am-cap{grid-column:1/-1;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:.5rem;text-align:right}
.home{display:grid;gap:1.25rem;padding-block:0 3rem}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:1.25rem;display:grid;gap:1rem}
.sec{font-size:1.25rem}
.sec small{font-family:var(--f-mono);font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:.2rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.mode-card{text-align:left;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--surface-2);padding:1rem;cursor:pointer;display:grid;gap:.4rem;align-content:start}
.mode-card:hover{border-color:var(--accent)}
.mode-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mode-name{font-family:var(--f-display);font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.mode-name::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none}
.mode-card[aria-pressed="true"] .mode-name::before{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.mode-desc{color:var(--ink-2);font-size:.95rem}
.mode-feats{display:flex;flex-wrap:wrap;gap:.35rem;margin:.25rem 0 0;padding:0;list-style:none}
.mode-feats li{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.03em;border:1px solid var(--rule);border-radius:999px;padding:.12rem .55rem;background:var(--surface);color:var(--ink-2)}
.sys{display:grid;gap:.5rem}
.sys-head{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.sys-head h3{font-size:1.05rem}
.sys-count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip-t{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:.35rem .75rem;font-size:.9rem;cursor:pointer;display:inline-flex;gap:.4rem;align-items:center;min-height:36px}
.chip-t .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chip-t[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip-t[aria-pressed="true"] .n{color:var(--accent)}
.chip-t[aria-pressed="false"]{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem}
.field{display:grid;gap:.35rem}
.flabel{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-size:.9rem;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--accent);color:var(--accent);font-weight:700}
.toggle{display:inline-flex;align-items:center;gap:.55rem;cursor:pointer;border:0;background:none;padding:.2rem 0;font-size:.95rem;text-align:left}
.toggle .sw{width:38px;height:22px;border-radius:999px;background:var(--rule);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-checked="true"] .sw{background:var(--accent)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(16px)}
.startbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.startbar .hint{color:var(--muted);font-size:.9rem}
.resume{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;justify-content:space-between;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:1rem 1.25rem}
.resume p{margin:0}
.note{font-size:.92rem;color:var(--ink-2);border-left:3px solid var(--rule);padding:.25rem 0 .25rem 1rem;display:grid;gap:.4rem}
.note p{margin:0}
.note b{color:var(--ink)}
.mono{font-family:var(--f-mono);font-size:.85em}
.reset-row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}

/* ── status bar ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;align-items:center;gap:.6rem 1rem;padding-block:.6rem;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:.2rem .6rem;background:var(--ink);color:var(--bg)}
.pill.exam{background:var(--accent);color:var(--accent-ink)}
.qcount{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.95rem}
.qcount b{color:var(--ink)}
.spacer{flex:1}
.clock,.tally{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--ink-2)}
.clock.low{color:var(--bad)}
.bar .sm{display:none}
.progress{height:3px;background:var(--rule)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ── question ── */
.quiz{padding-block:1.25rem 0}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:1.25rem;box-shadow:var(--shadow);display:grid;gap:1rem}
.qmeta{display:flex;flex-wrap:wrap;gap:.4rem .75rem;align-items:center}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;border-radius:6px;padding:.15rem .5rem;background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2)}
.tag.topic{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag.flagged{color:var(--flag);border-color:var(--flag);background:transparent}
.qnum{font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--muted)}
.case{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.case-h{display:flex;align-items:center;gap:.5rem;padding:.45rem .75rem;border-bottom:1px solid var(--rule);background:var(--surface)}
.case-h span{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.case-h::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent)}
.case dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.4rem 1rem;padding:.75rem}
.case dt{font-weight:700;font-size:.85rem;color:var(--ink-2)}
.case dd{margin:0;font-size:.95rem;font-variant-numeric:tabular-nums}
.stem{font-size:1.12rem;line-height:1.5;margin:0}
.instr{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.9rem;margin:0;color:var(--ink-2)}
.instr .k{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:.1rem .4rem;background:var(--ink);color:var(--bg);font-weight:500}
.opts{display:grid;gap:.55rem}
.opt{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.75rem;align-items:start;width:100%;text-align:left;border:1.5px solid var(--rule);border-radius:10px;background:var(--surface);padding:.75rem .9rem;cursor:pointer;transition:border-color .12s,background .12s}
.opt:not(.locked):hover{border-color:var(--accent)}
.opt .box{width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;margin-top:1px;display:grid;place-items:center;flex:none}
.opt.mc .box{border-radius:50%}
.opt .let{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);margin-top:2px;min-width:1ch}
.opt .txt{display:grid;gap:.35rem}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .box{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked="true"] .box::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.opt.mc[aria-checked="true"] .box::after{width:8px;height:8px;border:0;border-radius:50%;background:var(--accent-ink);transform:none}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--rule)}
.opt.locked.s-hit,.opt.locked.s-hit:hover{border-color:var(--ok);background:var(--ok-soft)}
.opt.locked.s-miss,.opt.locked.s-miss:hover{border-color:var(--miss);border-style:dashed;background:var(--miss-soft)}
.opt.locked.s-wrong,.opt.locked.s-wrong:hover{border-color:var(--bad);background:var(--bad-soft)}
.opt.locked.s-skip{background:var(--surface)}
.opt.locked .box{background:transparent;border-color:var(--rule)}
.opt.locked .box::after{content:none}
.opt.locked.s-hit .box{background:var(--ok);border-color:var(--ok)}
.opt.locked.s-wrong .box{background:var(--bad);border-color:var(--bad)}
.opt.locked.s-miss .box{border-color:var(--miss)}
.opt.locked.s-hit .box::after{content:"";width:10px;height:6px;border:0;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);border-radius:0;background:none;transform:translateY(-1px) rotate(-45deg)}
.opt.locked.s-wrong .box::after{content:"\00D7";width:auto;height:auto;border:0;border-radius:0;background:none;transform:none;color:var(--surface);font-weight:700;font-size:18px;line-height:1}
.verdict{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.s-hit .verdict{color:var(--ok)} .s-miss .verdict{color:var(--miss)} .s-wrong .verdict{color:var(--bad)} .s-skip .verdict{color:var(--muted)}
.why{font-size:.93rem;color:var(--ink-2);margin:0}
.result{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;border-radius:10px;padding:.75rem 1rem;border:1.5px solid}
.result h3{font-size:1.25rem}
.result.ok{border-color:var(--ok);background:var(--ok-soft)} .result.ok h3{color:var(--ok)}
.result.part{border-color:var(--miss);background:var(--miss-soft)} .result.part h3{color:var(--miss)}
.result.bad{border-color:var(--bad);background:var(--bad-soft)} .result.bad h3{color:var(--bad)}
.result.none{border-color:var(--rule);background:var(--surface-2)}
.result .pts{font-family:var(--f-mono);font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.key{border-radius:10px;padding:.85rem 1rem;background:var(--surface-2);border:1px solid var(--rule);display:grid;gap:.3rem}
.key .kl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;justify-self:start;background:var(--hilite);color:var(--ink);padding:.05rem .4rem;border-radius:3px}
.key p{margin:0;font-weight:700}
.actions{position:sticky;bottom:0;z-index:15;margin-top:1rem;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions-in{display:flex;gap:.6rem;align-items:center;padding-block:.7rem;flex-wrap:wrap}
.kbd-hint{font-size:.8rem;color:var(--muted)}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);color:var(--flag)}

/* ── navigator drawer ── */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(26rem,100%);background:var(--surface);z-index:41;border-left:1px solid var(--rule);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--rule)}
.drawer-h h2{font-size:1.2rem}
.drawer-b{overflow:auto;padding:1rem 1.25rem;display:grid;gap:1rem;align-content:start}
.legend{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--rule);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:.4rem}
.cell{position:relative;aspect-ratio:1;border:1.5px solid var(--rule);border-radius:7px;background:var(--surface);font-family:var(--f-mono);font-size:.8rem;cursor:pointer;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.cell.ans{background:var(--accent-soft);border-color:var(--accent)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.part{background:var(--miss-soft);border-color:var(--miss);color:var(--miss)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{box-shadow:0 0 0 2px var(--ink)}
.cell.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.finish{border-top:1px solid var(--rule);padding-top:1rem;display:grid;gap:.6rem}
.finish p{margin:0;font-size:.95rem}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:.85rem 1rem;display:grid;gap:.6rem}

/* ── results ── */
.results{padding-block:2rem 3rem;display:grid;gap:1.5rem}
.scorebox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.5rem;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:1.25rem 1.5rem;box-shadow:var(--shadow)}
.big{font-family:var(--f-display);font-size:clamp(3.5rem,12vw,5.5rem);line-height:.9;font-weight:700;font-variant-numeric:tabular-nums}
.big small{font-size:.45em;color:var(--muted)}
.scoredet{display:grid;gap:.35rem}
.scoredet p{margin:0;color:var(--ink-2)}
.scoredet strong{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:.85rem 1rem;display:grid;gap:.15rem}
.stat .l{font-size:.8rem;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .s{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-2)}
.bars{display:grid;gap:.55rem;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:1rem 1.25rem}
.brow{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 4.5rem;gap:.75rem;align-items:center;font-size:.92rem}
.brow .bn{overflow-wrap:anywhere}
.track{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px}
.track i.ok{background:var(--ok)} .track i.part{background:var(--miss)} .track i.bad{background:var(--bad)}
.bv{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.sub{font-size:1.2rem}
.res-actions{display:flex;flex-wrap:wrap;gap:.6rem}
.empty{color:var(--muted);margin:0}

@media (max-width:640px){
  .mast-in{grid-template-columns:1fr}
  .amsler{aspect-ratio:auto;grid-template-areas:none;grid-template-rows:none;grid-template-columns:repeat(3,auto);justify-content:space-between;padding:.75rem;background-size:16px 16px}
  .am-stat:nth-child(n){grid-area:auto;align-self:center;justify-self:start}
  .am-dot{display:none}
  .bar-in{flex-wrap:nowrap;gap:.5rem}
  .bar .tally,.qcount .ql,.bar .lg{display:none}
  .bar .sm{display:inline}
  .bar .btn.small{padding:.3rem .7rem;font-size:.85rem;min-height:36px}
  .modes{grid-template-columns:1fr}
  .case dl{grid-template-columns:1fr;gap:.1rem}
  .case dd{margin-bottom:.45rem}
  .scorebox{grid-template-columns:1fr;gap:.75rem}
  .stats{grid-template-columns:1fr 1fr}
  .brow{grid-template-columns:minmax(0,1fr) 4rem;row-gap:.2rem}
  .brow .track{grid-column:1/-1;grid-row:2}
  .kbd-hint{display:none}
  .stem{font-size:1.05rem}
}
@media (max-width:480px){ .bar .pill{display:none} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script id="qdata" type="application/json">[{"topic":"Stroke","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"A client is in inpatient rehabilitation 3 weeks after an ischemic stroke affecting the left cerebral hemisphere. Which findings would the nurse expect? Select all that apply.","case":null,"options":[{"t":"Weakness of the right arm and leg","c":true,"r":"Motor tracts cross, so a left-hemisphere stroke produces right-sided weakness or paralysis."},{"t":"Difficulty finding words or understanding speech","c":true,"r":"The language centers sit in the left hemisphere for most people, so aphasia is a hallmark of left-brain stroke."},{"t":"A slow, cautious approach to new tasks","c":true,"r":"Left-brain stroke tends to produce slow, hesitant, careful behavior. These clients often need encouragement more than supervision."},{"t":"Ignoring food and objects on the left side","c":false,"r":"Left neglect is a right-hemisphere finding because the right parietal lobe handles spatial awareness."},{"t":"Impulsive attempts to walk without help","c":false,"r":"Impulsivity and poor insight into deficits are typical of right-brain stroke."},{"t":"Trouble with reading, writing, and simple math","c":true,"r":"Logical, analytical, and language-based tasks such as reading, writing, and math are left-hemisphere functions."}],"key":"Left brain: language, logic, slow and cautious, right-sided weakness. Right brain: spatial problems, left neglect, impulsive with poor judgment, left-sided weakness.","id":1,"system":"Neuro"},{"topic":"Stroke","type":"mc","need":"Safety and Infection Control","cj":"Take Action","stem":"Based on the nurses' notes, which action is the nurse's priority?","case":{"title":"Nurses' Notes · 0200","rows":[["History","Right-hemisphere ischemic stroke 4 weeks ago. Left hemiparesis."],["Finding","Sitting on the edge of the bed attempting to stand. Left arm hanging over the side rail."],["Client states","“I'm fine, I can walk to the bathroom myself.”"],["Note","Reminded twice this shift to call for help before getting up."]]},"options":[{"t":"Activate a bed exit alarm, keep the bed low and locked, and round on the client frequently","c":true,"r":"Right-hemisphere stroke causes impulsivity and poor awareness of deficits, so verbal reminders are not reliable. Environmental safety measures and close monitoring prevent falls."},{"t":"Remind the client every hour to use the call light before getting up","c":false,"r":"The client has already ignored two reminders. Impulsivity and lack of insight mean teaching alone will not keep this client safe."},{"t":"Apply bilateral wrist restraints until morning","c":false,"r":"Restraints are a last resort, require a provider order, and increase agitation and injury. Less restrictive measures come first."},{"t":"Move the call light and water to the client's left side to encourage visual scanning","c":false,"r":"Scanning practice is a rehab goal, but putting essential items in the neglected field right now makes it more likely the client gets up to find them. Safety comes first."}],"key":"Right-brain stroke clients overestimate what they can do. Plan for safety with alarms, low beds, and frequent rounding instead of relying on the client to call.","id":2,"system":"Neuro"},{"topic":"Stroke","type":"sata","need":"Reduction of Risk Potential","cj":"Take Action","stem":"A client with dysphagia from a stroke 6 weeks ago is eating lunch. The speech-language pathologist has cleared the client for a mechanical soft diet with nectar-thick liquids. Which actions by the nurse are appropriate? Select all that apply.","case":null,"options":[{"t":"Seat the client fully upright in a chair or at 90 degrees for the meal","c":true,"r":"Upright positioning uses gravity to protect the airway and reduces aspiration risk."},{"t":"Place small bites toward the back of the mouth on the unaffected side","c":true,"r":"The unaffected side has intact sensation and muscle control, so the client can manage the bolus there."},{"t":"Offer thin water through a straw between bites to help food go down","c":false,"r":"Thin liquids move too fast for a weak swallow, and straws deliver a larger, faster bolus. The order is for nectar-thick liquids only."},{"t":"Turn off the television and limit conversation during the meal","c":true,"r":"A distraction-free environment lets the client concentrate on chewing and swallowing."},{"t":"Instruct the client to tuck the chin toward the chest when swallowing","c":true,"r":"The chin tuck narrows the airway entrance and helps direct the bolus into the esophagus."},{"t":"Check the affected cheek for pocketed food after the meal","c":true,"r":"Food collects on the weak side where the client cannot feel it, which creates a delayed aspiration risk."}],"key":"Dysphagia after stroke: upright, unaffected side, chin tuck, thickened liquids as ordered, no straws, no distractions, check for pocketing.","id":3,"system":"Neuro"},{"topic":"Stroke","type":"mc","need":"Basic Care and Comfort","cj":"Generate Solutions","stem":"A client with left homonymous hemianopsia after a stroke eats only the food on the right half of the meal tray and says the portions are too small. What is the best action by the nurse?","case":null,"options":[{"t":"Place the food within the client's intact field of vision and teach the client to turn the head to scan to the left","c":true,"r":"Hemianopsia is loss of the same half of the visual field in both eyes. Arranging food in the intact field meets the immediate need, and head turning helps the client compensate long term."},{"t":"Apply a patch over the client's left eye during meals","c":false,"r":"Patching one eye is a strategy for diplopia. In hemianopsia both eyes are missing the left field, so a patch only removes more vision."},{"t":"Feed the client the food remaining on the left side of the tray","c":false,"r":"The client can feed themselves. Taking over fosters dependence and does nothing for the visual deficit."},{"t":"Reassure the client that the visual loss will resolve within a few weeks","c":false,"r":"The field loss may be permanent. False reassurance keeps the client from learning to compensate."}],"key":"Hemianopsia: arrange the environment within the intact field for now, and teach scanning toward the lost field.","id":4,"system":"Neuro"},{"topic":"Stroke","type":"mc","need":"Health Promotion and Maintenance","cj":"Evaluate Outcomes","stem":"A client was seen in the clinic after a 20-minute episode of right hand weakness and slurred speech that fully resolved. After teaching about transient ischemic attack (TIA), which client statement indicates a need for further teaching?","case":null,"options":[{"t":"“Since my symptoms went away completely, I can wait and mention it at my yearly physical.”","c":true,"r":"A TIA is a medical emergency and a warning sign of stroke. About 20% of people with a TIA progress to stroke, so the client needs prompt evaluation."},{"t":"“Having a TIA means I'm at higher risk of having a stroke.”","c":false,"r":"Correct. A TIA signals progressive cerebrovascular disease."},{"t":"“If this happens again, I'll call 911 even if the symptoms start getting better.”","c":false,"r":"Correct. There is no way to predict whether symptoms will resolve or progress to a stroke."},{"t":"“Keeping my blood pressure under control will lower my risk.”","c":false,"r":"Correct. Hypertension is the most important modifiable stroke risk factor."}],"key":"TIA symptoms resolve, usually within an hour, but a TIA is still an emergency. The ABCD tool helps predict stroke risk afterward.","id":5,"system":"Neuro"},{"topic":"Stroke","type":"sata","need":"Health Promotion and Maintenance","cj":"Analyze Cues","stem":"The nurse is planning stroke prevention teaching for this client. Which risk factors can be modified through teaching and treatment? Select all that apply.","case":{"title":"Health History","rows":[["Client","46-year-old female, ischemic stroke 2 months ago"],["Medical","Hypertension, type 2 diabetes, BMI 34"],["Medications","Lisinopril, metformin, combined oral contraceptive"],["Family","Mother had a stroke at age 60"],["Social","Identifies as Black. Works as a school bus driver."]]},"options":[{"t":"Hypertension","c":true,"r":"The leading modifiable risk factor. Medication adherence, sodium reduction, and home BP checks lower risk."},{"t":"Type 2 diabetes","c":true,"r":"Diabetes accelerates atherosclerosis. Glycemic control reduces risk."},{"t":"Combined oral contraceptive use","c":true,"r":"Hormonal contraceptives increase clotting risk, especially with hypertension. The client can discuss a nonhormonal method with the provider."},{"t":"Obesity","c":true,"r":"Weight loss improves blood pressure, glucose, and lipids."},{"t":"Mother's history of stroke","c":false,"r":"Family history and genetics cannot be changed."},{"t":"Race","c":false,"r":"Ethnicity is nonmodifiable. Black adults have higher stroke rates, which makes control of the modifiable factors even more important."}],"key":"Nonmodifiable: age, gender, ethnicity, genetics. Modifiable: hypertension, heart disease, diabetes, alcohol, inactivity, obesity, hormonal contraceptives, smoking.","id":6,"system":"Neuro"},{"topic":"Stroke","type":"mc","need":"Management of Care","cj":"Take Action","stem":"The nurse is precepting a nursing student who is completing a National Institutes of Health Stroke Scale (NIHSS) assessment. Which action by the student requires the nurse to intervene?","case":null,"options":[{"t":"Scoring arm drift based on what the student believes the client could do with more effort","c":true,"r":"NIHSS scores must reflect what the client actually does, not what the examiner thinks the client can do. This needs correction."},{"t":"Completing the items in the order listed on the scale","c":false,"r":"Appropriate. Items are rated in the order listed."},{"t":"Leaving earlier item scores unchanged after finishing the exam","c":false,"r":"Appropriate. The examiner does not go back and change scores."},{"t":"Explaining that a higher total score means a more severe stroke","c":false,"r":"Accurate. Scores range from 0 to 42, and higher scores mean greater severity."}],"key":"NIHSS rules: rate in the order listed, never go back and change a score, and score what the client does.","id":7,"system":"Neuro"},{"topic":"Stroke","type":"sata","need":"Basic Care and Comfort","cj":"Take Action","stem":"A client with right hemiplegia 2 months after a stroke is on a medical unit. Which interventions help prevent complications? Select all that apply.","case":null,"options":[{"t":"Support the affected arm on a pillow when the client is sitting","c":true,"r":"The flaccid shoulder is prone to subluxation. Supporting the arm keeps the joint aligned."},{"t":"Pull the client up in bed by holding under the affected arm","c":false,"r":"Pulling on the affected arm can cause shoulder subluxation and pain. Use a lift sheet."},{"t":"Turn and reposition the client at least every 2 hours","c":true,"r":"Repositioning prevents pressure injuries, atelectasis, and pneumonia."},{"t":"Perform passive range of motion on the affected extremities","c":true,"r":"ROM prevents contractures and maintains joint mobility."},{"t":"Offer the bedpan or commode on a regular schedule","c":true,"r":"Timed toileting supports bladder retraining and prevents distention and incontinence."},{"t":"Keep an indwelling urinary catheter in place to manage incontinence","c":false,"r":"Long-term catheters raise the risk of catheter-associated UTI. Bladder retraining is preferred."}],"key":"Chronic stroke care targets immobility complications: subluxation, contractures, pressure injury, pneumonia, constipation, and bladder dysfunction.","id":8,"system":"Neuro"},{"topic":"Stroke","type":"sata","need":"Psychosocial Integrity","cj":"Take Action","stem":"A client with expressive (Broca's) aphasia after a left-hemisphere stroke becomes tearful when unable to get words out. Which approaches by the nurse are appropriate? Select all that apply.","case":null,"options":[{"t":"Ask simple questions the client can answer with yes or no","c":true,"r":"Expressive aphasia affects speech production while comprehension is usually intact. Yes-or-no questions give the client a reliable way to respond."},{"t":"Provide a picture communication board","c":true,"r":"Pictures let the client point to needs and reduce frustration."},{"t":"Allow extra time for the client to respond","c":true,"r":"Rushing increases frustration. Patience gives the client the best chance to communicate."},{"t":"Speak more loudly so the client can understand","c":false,"r":"Aphasia is not a hearing problem. A loud voice can feel demeaning."},{"t":"Finish the client's sentences to save effort","c":false,"r":"Completing sentences removes practice and frustrates the client if the guess is wrong."},{"t":"Limit conversation until speech therapy is complete","c":false,"r":"Withdrawing communication increases isolation. The client needs frequent chances to communicate."}],"key":"Aphasia: give time, keep questions simple, use gestures and picture boards. Do not shout, rush, or finish sentences.","id":9,"system":"Neuro"},{"topic":"Stroke","type":"sata","need":"Psychosocial Integrity","cj":"Generate Solutions","stem":"The spouse of a client 6 months after a stroke tells the nurse, “I'm exhausted. I do everything for him, and he cries for no reason.” Which nursing actions are appropriate? Select all that apply.","case":null,"options":[{"t":"Refer the spouse to social work for respite care options","c":true,"r":"Respite care gives the caregiver planned breaks and reduces burnout."},{"t":"Explain that sudden crying or laughing can be caused by the stroke itself","c":true,"r":"Emotional lability results from damage to emotional control pathways. Understanding this helps the caregiver not take it personally."},{"t":"Screen the spouse for signs of depression","c":true,"r":"Caregivers of stroke survivors have high rates of depression, so their mental health is part of the plan."},{"t":"Suggest a stroke caregiver support group","c":true,"r":"Support groups reduce isolation and share practical coping strategies."},{"t":"Encourage the client to do as much of his own self-care as he can","c":true,"r":"Promoting independence supports rehab goals and lightens the caregiver's load."},{"t":"Advise the spouse to keep doing all ADLs for the client because it is faster","c":false,"r":"Doing everything for the client increases caregiver burden and prevents the client from regaining function."}],"key":"Chronic neuro disease affects the whole family. Assess the caregiver, explain behavior changes, promote client independence, and connect the family with resources.","id":10,"system":"Neuro"},{"topic":"Stroke","type":"mc","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"The nurse reviews four clients admitted with new stroke symptoms. Which presentation is most consistent with an embolic stroke?","case":null,"options":[{"t":"A 74-year-old with atrial fibrillation who suddenly could not lift the left arm while eating breakfast","c":true,"r":"Embolic strokes occur while awake, produce sudden, immediate deficits, and usually come from a cardiac source such as atrial fibrillation."},{"t":"A 70-year-old who woke up with right-sided weakness that has slowly worsened over the morning","c":false,"r":"Thrombotic strokes often occur during sleep and progress gradually as a clot forms over atherosclerotic plaque."},{"t":"A 45-year-old who developed the worst headache of her life while lifting weights","c":false,"r":"This is classic for subarachnoid hemorrhage from a ruptured aneurysm during strenuous activity."},{"t":"A 68-year-old with long-standing uncontrolled hypertension whose deficits developed over several hours at rest","c":false,"r":"This fits an intracerebral (hypertensive) hemorrhage, which often occurs when the client is calm."}],"key":"Thrombotic: during sleep, gradual. Embolic: while awake, sudden, think atrial fibrillation. SAH: worst headache, exertion. ICH: chronic hypertension.","id":11,"system":"Neuro"},{"topic":"Parkinson's Disease","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"The nurse is assessing a client newly diagnosed with Parkinson's disease. Which findings are consistent with this diagnosis? Select all that apply.","case":null,"options":[{"t":"Hand tremor at rest that lessens with purposeful movement","c":true,"r":"PD tremor is a resting, pill-rolling tremor that often decreases with intentional movement."},{"t":"Jerky, ratchet-like resistance during passive wrist movement","c":true,"r":"This is cogwheel rigidity, one of the four primary manifestations."},{"t":"Tremor that worsens as the hand approaches a target","c":false,"r":"An intention tremor points to cerebellar disease such as MS, not PD."},{"t":"Short, shuffling steps with difficulty starting to walk","c":true,"r":"Bradykinesia causes trouble initiating movement and a shuffling gait."},{"t":"Masklike face with infrequent blinking","c":true,"r":"Bradykinesia of the facial muscles produces a blank expression and slowed blinking."},{"t":"Involuntary writhing and twisting movements of the face and trunk","c":false,"r":"Chorea is the hallmark of Huntington's disease, which involves excess dopamine activity."}],"key":"TRAP: Tremor at rest, Rigidity (cogwheel), Akinesia or bradykinesia, Postural instability. Two of four with asymmetric onset supports the diagnosis.","id":12,"system":"Neuro"},{"topic":"Parkinson's Disease","type":"mc","need":"Pharmacological Therapies","cj":"Evaluate Outcomes","stem":"A client with Parkinson's disease is started on carbidopa-levodopa. Which client statement indicates the teaching was effective?","case":null,"options":[{"t":"“I'll eat most of my protein at supper so it doesn't interfere with my daytime doses.”","c":true,"r":"Dietary protein competes with levodopa for absorption and transport into the brain. Limiting protein to the evening meal improves daytime symptom control."},{"t":"“I'll take each dose with a high-protein snack to settle my stomach.”","c":false,"r":"Protein impairs levodopa absorption. A small carbohydrate snack works better if nausea occurs."},{"t":"“The carbidopa is the part that turns into dopamine in my brain.”","c":false,"r":"Levodopa crosses the blood-brain barrier and converts to dopamine. Carbidopa blocks peripheral breakdown so more levodopa reaches the brain and nausea is reduced."},{"t":"“This medicine will keep my Parkinson's from getting worse.”","c":false,"r":"Carbidopa-levodopa relieves symptoms but does not stop disease progression."}],"key":"Levodopa becomes dopamine. Carbidopa protects levodopa until it reaches the brain. Save protein for the evening meal.","id":13,"system":"Neuro"},{"topic":"Parkinson's Disease","type":"sata","need":"Pharmacological Therapies","cj":"Recognize Cues","stem":"A client has taken carbidopa-levodopa for 5 years. Which findings are adverse effects the nurse should report to the provider? Select all that apply.","case":null,"options":[{"t":"Involuntary writhing movements of the arms and tongue","c":true,"r":"Dyskinesias are a common long-term adverse effect and may mean the dose needs adjusting."},{"t":"Dizziness and a drop in blood pressure when standing","c":true,"r":"Orthostatic hypotension increases fall risk."},{"t":"New visual hallucinations in the evening","c":true,"r":"Hallucinations and confusion are adverse effects of dopaminergic therapy and may signal PD psychosis."},{"t":"Decreased resting tremor","c":false,"r":"This is the intended therapeutic effect."},{"t":"Symptoms returning before the next dose is due","c":true,"r":"The wearing-off effect is a motor fluctuation that may need a schedule change or an added COMT inhibitor."},{"t":"Easier initiation of walking","c":false,"r":"Improved gait initiation shows the drug is working."}],"key":"Long-term levodopa problems: dyskinesia, wearing-off and on-off fluctuations, orthostatic hypotension, hallucinations. Too much dopaminergic drug can paradoxically worsen symptoms.","id":14,"system":"Neuro"},{"topic":"Parkinson's Disease","type":"sata","need":"Pharmacological Therapies","cj":"Take Action","stem":"A client with Parkinson's disease is admitted with nausea and agitation. Which medications should the nurse question if prescribed? Select all that apply.","case":null,"options":[{"t":"Haloperidol","c":true,"r":"A dopamine blocker that worsens rigidity and bradykinesia. The decks list haloperidol and other tranquilizers as drugs that cause or worsen parkinsonism."},{"t":"Metoclopramide","c":true,"r":"Blocks dopamine receptors and can worsen parkinsonian symptoms."},{"t":"Prochlorperazine","c":true,"r":"A phenothiazine antiemetic that blocks dopamine."},{"t":"Rasagiline","c":false,"r":"An MAO-B inhibitor used to treat PD."},{"t":"Amantadine","c":false,"r":"Used in PD for rigidity and levodopa-induced dyskinesia."},{"t":"Polyethylene glycol","c":false,"r":"Appropriate for constipation, which is common in PD."}],"key":"Avoid dopamine blockers in PD: typical antipsychotics such as haloperidol, phenothiazines, metoclopramide, reserpine, methyldopa.","id":15,"system":"Neuro"},{"topic":"Parkinson's Disease","type":"sata","need":"Safety and Infection Control","cj":"Generate Solutions","stem":"The nurse is teaching the family of a client with Parkinson's disease about home safety. Which instructions should the nurse include? Select all that apply.","case":null,"options":[{"t":"Remove throw rugs and extra furniture from walkways","c":true,"r":"A shuffling gait and postural instability make tripping hazards dangerous."},{"t":"Use slip-on shoes or shoes with hook-and-loop fasteners","c":true,"r":"These promote independence as fine motor skills decline."},{"t":"If the feet freeze, rock side to side or imagine stepping over a line","c":true,"r":"These cues help break a freezing episode and restart movement."},{"t":"Get up slowly from lying or sitting positions","c":true,"r":"Orthostatic hypotension from the disease and its drugs increases fall risk."},{"t":"Serve three large meals a day to maintain weight","c":false,"r":"Small, frequent meals cut into bite-sized pieces are easier to eat and reduce fatigue and aspiration."},{"t":"Install grab bars and a raised toilet seat","c":true,"r":"These make transfers safer with rigidity, bradykinesia, and postural instability. Walking with a wide base of support also improves stability."}],"key":"PD safety: clear paths, easy clothing, rise slowly, wide base, rocking or a visual cue to unfreeze, small frequent meals.","id":16,"system":"Neuro"},{"topic":"Parkinson's Disease","type":"mc","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"Which explanation best describes why tremor and rigidity develop in Parkinson's disease?","case":null,"options":[{"t":"Loss of dopamine-producing neurons in the substantia nigra leaves the excitatory effects of acetylcholine unopposed","c":true,"r":"Normally inhibitory dopamine balances excitatory acetylcholine. When dopamine falls, acetylcholine dominates and causes tremor and rigidity."},{"t":"A deficiency of acetylcholine and GABA leads to a relative excess of dopamine","c":false,"r":"This describes Huntington's disease, which produces chorea."},{"t":"Antibodies attack acetylcholine receptors at the neuromuscular junction","c":false,"r":"This describes myasthenia gravis."},{"t":"Inflammation destroys the myelin sheath of nerves in the brain and spinal cord","c":false,"r":"This describes multiple sclerosis."}],"key":"PD = low dopamine, unopposed ACh. HD = low ACh and GABA, excess dopamine. Opposite problems, opposite drug strategies.","id":17,"system":"Neuro"},{"topic":"Parkinson's Disease","type":"mc","need":"Physiological Adaptation","cj":"Prioritize Hypotheses","stem":"Based on the assessment findings, which condition is the nurse's priority concern?","case":{"title":"Assessment · Day 2","rows":[["History","Advanced Parkinson's disease, lives with daughter"],["Intake","Coughs during meals, drools frequently, lost 3 kg in 1 month"],["Elimination","Last bowel movement 3 days ago"],["Mood","Flat affect. States, “I don't enjoy anything anymore.”"],["Vital signs","T 38.4 °C (101.1 °F) · HR 104 · RR 26 · BP 118/70 · SpO2 91% on room air"],["Lungs","Crackles in the right lower lobe"]]},"options":[{"t":"Aspiration pneumonia","c":true,"r":"Dysphagia and drooling plus fever, tachypnea, low SpO2, and right lower lobe crackles point to aspiration pneumonia, a leading cause of death in PD. Breathing comes first."},{"t":"Constipation","c":false,"r":"A real problem related to immobility and autonomic changes, but not life threatening right now."},{"t":"Depression","c":false,"r":"Important to address, but airway and breathing take priority over psychosocial needs."},{"t":"Weight loss","c":false,"r":"Significant and related to dysphagia, but the acute respiratory infection is the immediate threat."}],"key":"In advanced PD, dysphagia plus fever and crackles means aspiration pneumonia until proven otherwise.","id":18,"system":"Neuro"},{"topic":"Parkinson's Disease","type":"sata","need":"Pharmacological Therapies","cj":"Analyze Cues","stem":"The nurse is reviewing medications used to treat Parkinson's disease. Which statements are accurate? Select all that apply.","case":null,"options":[{"t":"Pramipexole and ropinirole stimulate dopamine receptors directly","c":true,"r":"Dopamine agonists mimic dopamine and carry a lower early risk of dyskinesia than levodopa."},{"t":"Selegiline and rasagiline block the enzyme that breaks down dopamine","c":true,"r":"MAO-B inhibitors keep dopamine active longer."},{"t":"Entacapone is given with carbidopa-levodopa to extend each dose","c":true,"r":"COMT inhibitors block peripheral breakdown of levodopa and help with wearing-off."},{"t":"Anticholinergic drugs are the preferred first choice for older adults with memory problems","c":false,"r":"Anticholinergics cause confusion, urinary retention, and constipation and are generally avoided in older adults, especially with cognitive impairment."},{"t":"Amantadine can reduce involuntary movements caused by levodopa","c":true,"r":"Amantadine helps with dyskinesia and rigidity."}],"key":"Agonists mimic dopamine, MAO-B inhibitors save dopamine, COMT inhibitors save levodopa, anticholinergics quiet acetylcholine and are used cautiously in older adults.","id":19,"system":"Neuro"},{"topic":"Multiple Sclerosis","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"Which findings in this client's history support the provider's suspicion of multiple sclerosis? Select all that apply.","case":{"title":"Health History","rows":[["Client","29-year-old female, elementary school teacher"],["Last year","Blurred vision and pain with eye movement in the right eye that cleared after 6 weeks"],["Now","Numbness and tingling in both legs, fatigue that is worse in the afternoon"],["Client states","“When I bend my head forward, it feels like an electric shock runs down my back.”"],["Pattern","Symptoms have come and gone several times over the past year"]]},"options":[{"t":"Previous episode of painful vision loss in one eye","c":true,"r":"Optic neuritis is a common early presentation of MS."},{"t":"Electric shock sensation down the spine with neck flexion","c":true,"r":"This is Lhermitte's sign, caused by demyelinated lesions in the cervical cord."},{"t":"Numbness and tingling in the legs","c":true,"r":"Paresthesias and hypoesthesia come from demyelination of sensory pathways."},{"t":"Symptoms that come and go over time","c":true,"r":"A relapsing-remitting pattern is the most common course at diagnosis, about 85% of clients."},{"t":"Eyelid drooping that improves after resting","c":false,"r":"Ptosis that improves with rest is typical of myasthenia gravis and is not in this history."},{"t":"Pill-rolling tremor at rest","c":false,"r":"A resting tremor is a Parkinson's disease finding. MS causes intention tremor and ataxia."}],"key":"MS profile: woman age 20 to 40, optic neuritis, paresthesias, fatigue, Lhermitte's sign, relapses and remissions.","id":20,"system":"Neuro"},{"topic":"Multiple Sclerosis","type":"mc","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"A client with relapsing-remitting MS calls the clinic and reports that leg weakness and blurred vision got much worse after a long hot shower but improved after an hour resting in a cool room. What is the nurse's best response?","case":null,"options":[{"t":"“Heat slows signals through damaged nerves for a short time. This is not a new relapse, and lukewarm water can help prevent it.”","c":true,"r":"This is Uhthoff's sign, a pseudo-relapse. Rising body temperature temporarily slows conduction in demyelinated nerves, and symptoms reverse once the client cools down."},{"t":"“This is a new relapse, so you'll need to come in for IV corticosteroids today.”","c":false,"r":"Symptoms that resolve with cooling do not indicate new disease activity."},{"t":"“A hot bath every evening will help relax your muscle spasms.”","c":false,"r":"Heat worsens MS symptoms and creates a burn risk because of sensory deficits."},{"t":"“Call 911 because you may be having a stroke.”","c":false,"r":"The heat trigger and full reversal with cooling point to Uhthoff's sign, not a stroke."}],"key":"Uhthoff's sign: heat temporarily worsens MS symptoms. Avoid hot showers, hot tubs, saunas, and overheating.","id":21,"system":"Neuro"},{"topic":"Multiple Sclerosis","type":"sata","need":"Safety and Infection Control","cj":"Generate Solutions","stem":"The nurse is teaching a client with MS who has decreased sensation in both feet and urinary retention. Which instructions should the nurse include? Select all that apply.","case":null,"options":[{"t":"Check bath water temperature with a thermometer before getting in","c":true,"r":"Altered sensation means the client may not feel water hot enough to burn."},{"t":"Plan demanding tasks for times of highest energy and schedule rest periods","c":true,"r":"Energy conservation is central to managing MS fatigue."},{"t":"Learn intermittent self-catheterization","c":true,"r":"Self-catheterization empties the bladder fully and reduces infection risk from retention."},{"t":"Avoid all exercise to save energy","c":false,"r":"Regular, moderate activity and stretching maintain strength and prevent contractures."},{"t":"Limit fluid intake to reduce bladder problems","c":false,"r":"Fluids around 2,000 mL per day help prevent UTIs and constipation. Restricting fluids concentrates urine and increases infection risk."},{"t":"Use a heating pad on the legs to relieve numbness","c":false,"r":"Heating pads can burn areas with reduced sensation and can trigger Uhthoff's sign."}],"key":"MS teaching: avoid heat, check water temperature, about 2,000 mL fluids daily, self-cath for retention, energy conservation, moderate exercise, remove loose rugs.","id":22,"system":"Neuro"},{"topic":"Multiple Sclerosis","type":"mc","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"A client describes steadily worsening walking ability since symptoms began 3 years ago, with no clear attacks or periods of recovery. Which type of MS does the nurse recognize?","case":null,"options":[{"t":"Primary progressive MS","c":true,"r":"PPMS features steady worsening from the start without distinct relapses or remissions. It affects about 10% to 15% of clients."},{"t":"Relapsing-remitting MS","c":false,"r":"RRMS has clear attacks followed by partial or full recovery."},{"t":"Secondary progressive MS","c":false,"r":"SPMS starts as RRMS and later shifts to steady worsening. This client never had a relapsing phase."},{"t":"Clinically isolated syndrome","c":false,"r":"CIS is a single first episode of demyelination lasting at least 24 hours."}],"key":"RRMS: attacks then recovery. SPMS: began as RRMS, now steady decline. PPMS: steady decline from day one. CIS: one episode.","id":23,"system":"Neuro"},{"topic":"Multiple Sclerosis","type":"sata","need":"Pharmacological Therapies","cj":"Generate Solutions","stem":"A client with relapsing-remitting MS is starting a subcutaneous interferon beta disease-modifying therapy. Which points should the nurse include in teaching? Select all that apply.","case":null,"options":[{"t":"Flu-like symptoms are common, and a prescribed analgesic before the injection may help","c":true,"r":"Fever, chills, and aches are expected early effects that often lessen over time."},{"t":"Use the same injection site each time so the skin gets used to it","c":false,"r":"Sites are rotated to reduce injection-site reactions and tissue damage."},{"t":"Report feelings of depression or thoughts of self-harm","c":true,"r":"Interferons are associated with depression, so mood changes need prompt reporting."},{"t":"Keep appointments for liver function tests and blood counts","c":true,"r":"Interferons can cause liver injury and blood count changes."},{"t":"This medication will repair myelin that has already been damaged","c":false,"r":"DMTs reduce relapses and slow progression. They do not reverse existing damage."},{"t":"Stop the medication once symptoms go into remission","c":false,"r":"DMTs are long-term therapy. Stopping increases relapse risk."}],"key":"Disease-modifying therapies: start early, take long term, slow progression, do not repair damage. Delays in treatment are linked to poor outcomes.","id":24,"system":"Neuro"},{"topic":"Multiple Sclerosis","type":"sata","need":"Reduction of Risk Potential","cj":"Analyze Cues","stem":"Which diagnostic findings support a diagnosis of multiple sclerosis? Select all that apply.","case":null,"options":[{"t":"MRI with contrast showing white matter plaques in more than one area","c":true,"r":"MRI is the key test. Lesions in at least 2 locations within the CNS support MS."},{"t":"Cerebrospinal fluid with elevated IgG","c":true,"r":"Increased IgG reflects inflammation within the CNS."},{"t":"Delayed visual evoked potentials","c":true,"r":"Slowed conduction from the eye to the brain shows demyelination of the optic pathway."},{"t":"Positive acetylcholine receptor antibodies","c":false,"r":"This supports myasthenia gravis."},{"t":"Abnormal CAG repeat on genetic testing","c":false,"r":"This confirms Huntington's disease."},{"t":"Symptom improvement after a trial of levodopa","c":false,"r":"A positive levodopa response supports Parkinson's disease."}],"key":"No single test confirms MS. Diagnosis combines MRI plaques, CSF IgG, and evoked potentials with 2 or more attacks at least 1 month apart and other causes ruled out.","id":25,"system":"Neuro"},{"topic":"Myasthenia Gravis","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"A client is being evaluated for myasthenia gravis (MG). Which findings would the nurse expect? Select all that apply.","case":null,"options":[{"t":"Drooping eyelids and double vision that worsen as the day goes on","c":true,"r":"Ocular muscles are often affected first, and weakness increases with repeated use."},{"t":"Muscle strength that improves after a period of rest","c":true,"r":"MG weakness worsens with activity and improves with rest as acetylcholine receptors recover."},{"t":"Eyelids drooping further after looking upward for 2 to 3 minutes","c":true,"r":"Prolonged upward gaze is a bedside test for fatigability."},{"t":"Numbness and tingling in the hands","c":false,"r":"MG affects only the neuromuscular junction. Sensation is intact."},{"t":"Muscle twitching with visible wasting","c":false,"r":"Fasciculations and atrophy are typical of ALS, not MG."},{"t":"Weakness that is worst right after waking in the morning","c":false,"r":"MG weakness is usually least after rest, so strength is often best in the morning."}],"key":"MG = fatigable motor weakness with no sensory loss. Worse with activity and later in the day, better with rest.","id":26,"system":"Neuro"},{"topic":"Myasthenia Gravis","type":"mc","need":"Physiological Adaptation","cj":"Prioritize Hypotheses","stem":"Based on the assessment data, which finding is the nurse's priority?","case":{"title":"Assessment · 1400","rows":[["History","Myasthenia gravis, admitted with a urinary tract infection"],["Neuro","Bilateral ptosis, generalized fatigue"],["Swallowing","Difficulty swallowing pills, weak cough"],["Vital signs","HR 112 · RR 28 and shallow · BP 132/84 · SpO2 91% on room air"],["Vital capacity","1.1 L (yesterday 2.2 L)"]]},"options":[{"t":"Falling vital capacity with shallow respirations","c":true,"r":"A dropping vital capacity signals respiratory muscle failure from myasthenic crisis, which may require intubation. Infection is a common trigger."},{"t":"Bilateral ptosis","c":false,"r":"Expected in MG and not immediately life threatening."},{"t":"Difficulty swallowing pills","c":false,"r":"Raises aspiration risk, but ventilatory failure is the more immediate threat."},{"t":"Generalized fatigue","c":false,"r":"Expected in MG and not the priority."}],"key":"In MG crisis, the airway and breathing come first. Trend vital capacity and negative inspiratory force.","id":27,"system":"Neuro"},{"topic":"Myasthenia Gravis","type":"sata","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"A client with MG took several extra doses of pyridostigmine because of increasing weakness. Which findings would help the nurse recognize cholinergic crisis rather than myasthenic crisis? Select all that apply.","case":null,"options":[{"t":"Increased salivation and bronchial secretions","c":true,"r":"Excess acetylcholine stimulates muscarinic receptors and increases secretions."},{"t":"Abdominal cramping and diarrhea","c":true,"r":"Cholinergic overstimulation increases GI motility."},{"t":"Profuse sweating","c":true,"r":"Diaphoresis is a muscarinic effect of excess acetylcholine."},{"t":"Generalized muscle weakness","c":false,"r":"Weakness occurs in both crises, so it does not tell them apart."},{"t":"Ptosis and difficulty breathing","c":false,"r":"Both crises cause ptosis and respiratory compromise."},{"t":"Nausea and vomiting","c":true,"r":"GI symptoms point to cholinergic excess."}],"key":"Both crises cause weakness and breathing trouble. Cholinergic crisis adds the SLUDGE signs: salivation, lacrimation, urination, diarrhea, GI cramping, emesis, plus sweating.","id":28,"system":"Neuro"},{"topic":"Myasthenia Gravis","type":"mc","need":"Pharmacological Therapies","cj":"Generate Solutions","stem":"A client with MG is prescribed pyridostigmine. Which instruction is most important for the nurse to include?","case":null,"options":[{"t":"Take each dose on time, about 30 to 60 minutes before meals","c":true,"r":"Dosing before meals gives peak strength for chewing and swallowing. Taking doses on schedule helps prevent both myasthenic and cholinergic crisis."},{"t":"Take an extra dose any time you feel weak","c":false,"r":"Extra doses can cause cholinergic crisis. Dose changes must come from the provider."},{"t":"Skip a dose on days when you feel strong","c":false,"r":"Missed doses can trigger myasthenic crisis."},{"t":"Take the full daily dose at bedtime to avoid side effects","c":false,"r":"Pyridostigmine is short acting and is dosed through the day to match activity."}],"key":"Pyridostigmine: on time every time, before meals, no self-adjusting. The dose is tailored to avoid both crises.","id":29,"system":"Neuro"},{"topic":"Myasthenia Gravis","type":"sata","need":"Health Promotion and Maintenance","cj":"Generate Solutions","stem":"Which instructions should the nurse include when teaching a client with MG how to prevent exacerbations? Select all that apply.","case":null,"options":[{"t":"Plan activities for when the medication is at its peak and rest between tasks","c":true,"r":"Energy conservation reduces fatigue and weakness."},{"t":"Carry an emergency wallet card and keep a bag packed in case of crisis","c":true,"r":"Preparation speeds care during a myasthenic crisis."},{"t":"Avoid crowds and people with respiratory infections","c":true,"r":"Infection is a major trigger for myasthenic crisis."},{"t":"Use artificial tears and protect the eyes if the lids do not close fully","c":true,"r":"Ptosis and weak eye closure can lead to corneal damage."},{"t":"Eat slowly and choose semi-solid foods when chewing is tiring","c":true,"r":"Slow eating with easy textures reduces fatigue and aspiration."},{"t":"Eat large meals quickly before the jaw muscles tire","c":false,"r":"Fast, large meals increase fatigue and aspiration risk. Meals should be eaten slowly with thorough chewing."}],"key":"MG triggers: infection, stress, heat, surgery, missed doses, and certain drugs. Conserve energy, protect the eyes, eat slowly, be crisis-ready.","id":30,"system":"Neuro"},{"topic":"Myasthenia Gravis","type":"sata","need":"Pharmacological Therapies","cj":"Take Action","stem":"A client with MG is admitted with pneumonia. Which medications should the nurse clarify with the provider because they can worsen MG? Select all that apply.","case":null,"options":[{"t":"Gentamicin","c":true,"r":"Aminoglycosides impair neuromuscular transmission and can precipitate crisis."},{"t":"Ciprofloxacin","c":true,"r":"Fluoroquinolones can worsen MG weakness and carry a warning for clients with MG."},{"t":"Magnesium sulfate","c":true,"r":"Magnesium reduces acetylcholine release at the neuromuscular junction."},{"t":"Acetaminophen","c":false,"r":"Safe for fever and pain in MG."},{"t":"Pyridostigmine","c":false,"r":"This is the client's maintenance anticholinesterase drug."}],"key":"Drugs that worsen MG: aminoglycosides, fluoroquinolones, magnesium, beta-blockers, some anesthetics and neuromuscular blockers.","id":31,"system":"Neuro"},{"topic":"Myasthenia Gravis","type":"sata","need":"Management of Care","cj":"Generate Solutions","stem":"A client is admitted in myasthenic crisis. Which interventions should the nurse anticipate? Select all that apply.","case":null,"options":[{"t":"Monitor vital capacity and negative inspiratory force frequently","c":true,"r":"These measures detect respiratory muscle failure early."},{"t":"Keep suction and intubation equipment at the bedside","c":true,"r":"Weak swallowing and cough increase aspiration and airway risk."},{"t":"Prepare for plasmapheresis or IV immunoglobulin","c":true,"r":"Both rapidly reduce the effect of circulating antibodies during crisis."},{"t":"Give atropine as the first-line treatment","c":false,"r":"Atropine is the antidote for cholinergic crisis, not myasthenic crisis."},{"t":"Encourage thin liquids to keep the client hydrated","c":false,"r":"Dysphagia makes thin liquids an aspiration risk. The client may need to be NPO."}],"key":"Myasthenic crisis: too little drug or a trigger. Support breathing and remove antibodies. Cholinergic crisis: too much drug, and atropine is the antidote.","id":32,"system":"Neuro"},{"topic":"ALS","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"Which findings would the nurse expect in a client with amyotrophic lateral sclerosis (ALS)? Select all that apply.","case":null,"options":[{"t":"Muscle cramps and visible twitching","c":true,"r":"Cramps and involuntary contractions reflect lower motor neuron loss."},{"t":"Progressive weakness with muscle wasting","c":true,"r":"Loss of upper and lower motor neurons causes weakness and atrophy."},{"t":"Slurred speech","c":true,"r":"Bulbar involvement causes dysarthria."},{"t":"Loss of sensation in the feet","c":false,"r":"ALS affects motor neurons only. Sensation is preserved."},{"t":"Early loss of bowel and bladder control","c":false,"r":"Sphincter control is usually spared until late, if it is affected at all."},{"t":"Involuntary writhing movements of the face","c":false,"r":"Chorea is a feature of Huntington's disease."}],"key":"ALS is pure motor: weakness, atrophy, cramps, twitching, dysarthria, dysphagia. Sensation and usually cognition stay intact. Death usually occurs within 3 to 5 years.","id":33,"system":"Neuro"},{"topic":"ALS","type":"mc","need":"Pharmacological Therapies","cj":"Evaluate Outcomes","stem":"A client with ALS starts riluzole. Which statement indicates understanding of the medication?","case":null,"options":[{"t":"“This medicine may slow the disease and give me a few more months, but it won't cure it.”","c":true,"r":"Riluzole reduces glutamate and modestly extends survival. It does not reverse damage."},{"t":"“This will rebuild the muscle strength I've already lost.”","c":false,"r":"Lost motor neurons are not restored."},{"t":"“This will dry up the extra saliva in my mouth.”","c":false,"r":"Glycopyrrolate is used for excess saliva."},{"t":"“This will stop my muscle cramps.”","c":false,"r":"Baclofen or diazepam treats cramps and spasticity."}],"key":"Riluzole lowers glutamate, edaravone is an antioxidant, tofersen targets SOD1 mutations. None is a cure.","id":34,"system":"Neuro"},{"topic":"ALS","type":"mc","need":"Physiological Adaptation","cj":"Prioritize Hypotheses","stem":"Based on the assessment, which problem should the nurse address first?","case":{"title":"Assessment · Home Health Visit","rows":[["History","ALS diagnosed 2 years ago"],["Speech","Slow and difficult to understand"],["Nutrition","Lost 4 kg this month, coughs with thin liquids"],["Respiratory","Using neck muscles to breathe, weak cough · RR 26 · SpO2 89% on room air"],["Client states","“I'm scared about what comes next.”"]]},"options":[{"t":"Impaired breathing from respiratory muscle weakness","c":true,"r":"Accessory muscle use, a weak cough, and SpO2 of 89% show developing respiratory failure, the leading cause of death in ALS."},{"t":"Impaired verbal communication","c":false,"r":"Important, but breathing comes first."},{"t":"Weight loss from dysphagia","c":false,"r":"Needs attention, but it is not the immediate threat."},{"t":"Anxiety about the future","c":false,"r":"Psychosocial needs follow physiologic priorities."}],"key":"ABCs first. In ALS, respiratory muscle weakness is what threatens life. BiPAP or a tracheostomy may be considered based on the client's wishes.","id":35,"system":"Neuro"},{"topic":"ALS","type":"sata","need":"Management of Care","cj":"Generate Solutions","stem":"The nurse is planning care for a client with progressing ALS. Which interventions are appropriate? Select all that apply.","case":null,"options":[{"t":"Introduce an eye-gaze or alphabet communication board before speech is lost","c":true,"r":"Setting up tools early lets the client keep expressing needs and decisions."},{"t":"Discuss advance directives, including wishes about ventilation and feeding tubes","c":true,"r":"These decisions should be made while the client can still communicate and decide."},{"t":"Keep the head of the bed elevated during and after meals","c":true,"r":"Upright positioning reduces aspiration risk from dysphagia."},{"t":"Encourage high-intensity resistance training to rebuild strength","c":false,"r":"Strenuous exercise worsens fatigue. Low-impact exercise and ROM help maintain function."},{"t":"Refer the client and family to palliative care","c":true,"r":"Palliative care supports symptom control, end-of-life planning, and family coping."}],"key":"ALS care: communication, aspiration prevention, respiratory support, nutrition, fall prevention, end-of-life planning, family support.","id":36,"system":"Neuro"},{"topic":"ALS","type":"mc","need":"Psychosocial Integrity","cj":"Take Action","stem":"A client with ALS says, “I know exactly what's happening to me. I'm terrified I'm going to choke to death.” Which response by the nurse is best?","case":null,"options":[{"t":"“You're aware of every change, and that sounds frightening. What worries you most about choking?”","c":true,"r":"Cognition usually stays intact in ALS, so clients are fully aware of their decline. Acknowledging the feeling and exploring the fear is therapeutic and opens the door to planning."},{"t":"“Try not to think about that. Let's focus on today.”","c":false,"r":"This dismisses the client's feelings and blocks communication."},{"t":"“Most people with ALS lose awareness near the end, so you won't notice.”","c":false,"r":"This is inaccurate. Most clients remain cognitively intact."},{"t":"“Your doctor can talk with you about that at your next appointment.”","c":false,"r":"This defers the concern instead of addressing it now."}],"key":"ALS clients usually stay mentally aware. Use therapeutic communication and plan ahead with them.","id":37,"system":"Neuro"},{"topic":"Huntington's Disease","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"A 42-year-old client with Huntington's disease is being assessed. Which findings would the nurse expect? Select all that apply.","case":null,"options":[{"t":"Writhing, twisting movements of the face and limbs","c":true,"r":"Chorea is the hallmark movement disorder of HD."},{"t":"Difficulty planning and staying on task","c":true,"r":"Early cognitive changes affect organization, focus, and learning new information."},{"t":"Irritability, depression, and impulsive behavior","c":true,"r":"Psychiatric symptoms are common and can appear before chorea."},{"t":"Choking while eating","c":true,"r":"Dysphagia develops as the disease progresses."},{"t":"Muscle rigidity with trouble balancing","c":true,"r":"Rigidity and balance problems are part of the HD movement disorder."},{"t":"Resting pill-rolling tremor","c":false,"r":"This is a Parkinson's disease finding."}],"key":"HD triad: movement (chorea, rigidity, dysphagia), cognitive decline progressing to dementia, psychiatric symptoms. Onset usually between 30 and 50.","id":38,"system":"Neuro"},{"topic":"Huntington's Disease","type":"mc","need":"Pharmacological Therapies","cj":"Analyze Cues","stem":"A client with Huntington's disease is prescribed tetrabenazine. The nurse understands this drug reduces chorea by which action?","case":null,"options":[{"t":"Depleting dopamine in the brain","c":true,"r":"HD involves low acetylcholine and GABA with a relative excess of dopamine. VMAT2 inhibitors such as tetrabenazine lower dopamine and reduce abnormal movements."},{"t":"Increasing dopamine in the basal ganglia","c":false,"r":"More dopamine would worsen chorea. Increasing dopamine is the goal in Parkinson's disease."},{"t":"Blocking breakdown of acetylcholine at the neuromuscular junction","c":false,"r":"This describes anticholinesterase drugs used in MG."},{"t":"Reducing glutamate release","c":false,"r":"This describes riluzole for ALS."}],"key":"HD drugs lower dopamine. PD drugs raise dopamine.","id":39,"system":"Neuro"},{"topic":"Huntington's Disease","type":"sata","need":"Psychosocial Integrity","cj":"Generate Solutions","stem":"A 26-year-old whose father has Huntington's disease is considering genetic testing. Which statements by the nurse are accurate? Select all that apply.","case":null,"options":[{"t":"“Each child of a parent with HD has a 50% chance of inheriting the gene.”","c":true,"r":"HD is autosomal dominant."},{"t":"“A positive test means you will develop HD, but it can't tell you when.”","c":true,"r":"The test predicts the disease but not the age of onset."},{"t":"“If you didn't inherit the expanded gene, you won't develop HD and can't pass it on.”","c":true,"r":"HD does not skip generations."},{"t":"“Genetic counseling before and after testing is recommended.”","c":true,"r":"Results carry major psychological, family, and life-planning consequences."},{"t":"“HD often skips a generation, so your children are probably safe.”","c":false,"r":"HD is autosomal dominant and does not skip generations."},{"t":"“Symptoms of HD usually begin in early childhood.”","c":false,"r":"Onset is usually between 30 and 50. Juvenile HD occurs in about 10% of cases."}],"key":"Autosomal dominant: 50% risk per child. Positive test means the person will develop HD. Negative test means they will not and cannot pass it on.","id":40,"system":"Neuro"},{"topic":"Huntington's Disease","type":"sata","need":"Basic Care and Comfort","cj":"Take Action","stem":"A client with Huntington's disease has constant chorea, coughs during meals, and has lost 5 kg. Which nutrition interventions are appropriate? Select all that apply.","case":null,"options":[{"t":"Provide high-calorie meals and snacks","c":true,"r":"Constant involuntary movement greatly increases calorie needs."},{"t":"Offer foods in a texture the client can swallow safely, as recommended by speech therapy","c":true,"r":"Dysphagia increases aspiration risk, so texture matters."},{"t":"Weigh the client regularly","c":true,"r":"Tracks whether intake is meeting the high energy demand."},{"t":"Limit calories to reduce the risk of aspiration","c":false,"r":"Restricting calories worsens weight loss. Aspiration is managed with texture and positioning, not by eating less."},{"t":"Restrict fluids to reduce choking episodes","c":false,"r":"Fluid restriction causes dehydration. Thickened liquids may be used instead."}],"key":"Chorea burns calories. HD clients need high-calorie, easy-to-swallow food and regular weights.","id":41,"system":"Neuro"},{"topic":"Huntington's Disease","type":"sata","need":"Safety and Infection Control","cj":"Generate Solutions","stem":"Which interventions should the nurse include in the plan of care for a client with advanced Huntington's disease? Select all that apply.","case":null,"options":[{"t":"Pad the side rails and keep the bed in the lowest position","c":true,"r":"Chorea can cause injury against hard surfaces and falls."},{"t":"Monitor for depression and suicidal thoughts","c":true,"r":"Clients with HD have a high risk of depression and suicide."},{"t":"Keep a calm, structured daily routine","c":true,"r":"Structure reduces agitation and supports declining cognition."},{"t":"Support caregivers and discuss palliative care","c":true,"r":"HD has no cure, and caregivers carry a heavy, long-term burden."},{"t":"Give multistep instructions to challenge thinking","c":false,"r":"Complex instructions cause frustration. Use simple, one-step directions."},{"t":"Apply restraints to control the involuntary movements","c":false,"r":"Restraints increase injury and agitation and do not stop chorea."}],"key":"HD care: safety, high calories, psychiatric monitoring, simple routines, a comfortable environment, caregiver support, palliative care.","id":42,"system":"Neuro"},{"topic":"Restless Legs Syndrome","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"A client reports trouble sleeping because of uncomfortable leg sensations. Which findings support a diagnosis of restless legs syndrome? Select all that apply.","case":null,"options":[{"t":"A crawling, creeping feeling deep in the legs with an urge to move them","c":true,"r":"An overwhelming urge to move with unpleasant sensations is the core criterion."},{"t":"Symptoms that start or worsen while sitting or lying down","c":true,"r":"Rest and inactivity trigger RLS symptoms."},{"t":"Relief while walking or stretching","c":true,"r":"Movement relieves symptoms as long as the activity continues."},{"t":"Symptoms that are worse in the evening and at night","c":true,"r":"Evening and nighttime worsening is a diagnostic criterion."},{"t":"Calf pain while walking that goes away with rest","c":false,"r":"This describes intermittent claudication from peripheral arterial disease, the opposite of the RLS pattern."}],"key":"URGE: Urge to move, Rest makes it worse, Gets better with movement, Evening and night worsening.","id":43,"system":"Neuro"},{"topic":"Restless Legs Syndrome","type":"sata","need":"Reduction of Risk Potential","cj":"Analyze Cues","stem":"The nurse is reviewing the history of a client with restless legs syndrome. Which findings could indicate secondary RLS? Select all that apply.","case":null,"options":[{"t":"Low serum ferritin","c":true,"r":"Iron deficiency is a major and treatable cause of secondary RLS."},{"t":"End-stage kidney disease on hemodialysis","c":true,"r":"Renal disease and dialysis are associated with RLS."},{"t":"Pregnancy in the third trimester","c":true,"r":"Many pregnant women develop RLS late in pregnancy."},{"t":"Chronic peripheral neuropathy","c":true,"r":"Neuropathy can cause secondary RLS."},{"t":"Hypertension controlled with lisinopril","c":false,"r":"Not a recognized cause of secondary RLS."},{"t":"Osteoarthritis of the knees","c":false,"r":"Not a cause of RLS."}],"key":"Secondary RLS: iron deficiency, kidney disease or dialysis, neuropathy, pregnancy. Treat the underlying cause.","id":44,"system":"Neuro"},{"topic":"Restless Legs Syndrome","type":"sata","need":"Basic Care and Comfort","cj":"Generate Solutions","stem":"Which self-care measures should the nurse teach a client with mild restless legs syndrome? Select all that apply.","case":null,"options":[{"t":"Cut back on caffeine, alcohol, and tobacco","c":true,"r":"These substances worsen RLS symptoms."},{"t":"Take a warm bath before bed","c":true,"r":"Warm baths can ease symptoms and promote sleep."},{"t":"Use an over-the-counter antihistamine such as diphenhydramine to help sleep","c":false,"r":"Antihistamines can worsen RLS and should be avoided."},{"t":"Massage or stretch the legs daily","c":true,"r":"Massage and stretching reduce symptoms."},{"t":"Keep a regular sleep schedule","c":true,"r":"Regular sleep habits help, since sleep deprivation worsens RLS."},{"t":"Keep a sleep diary to track symptoms and triggers","c":true,"r":"A sleep diary helps the provider confirm the pattern and judge treatment. Alcohol, like caffeine, worsens symptoms."}],"key":"RLS self-care: avoid caffeine, alcohol, nicotine, and antihistamines. Warm baths, massage, stretching, regular sleep, a sleep diary.","id":45,"system":"Neuro"},{"topic":"Restless Legs Syndrome","type":"mc","need":"Pharmacological Therapies","cj":"Generate Solutions","stem":"A client with nightly restless legs symptoms is prescribed ropinirole. Which instruction should the nurse give?","case":null,"options":[{"t":"Take the dose 1 to
