 3 hours before bedtime and get up slowly","c":true,"r":"Dopamine agonists are the first choice for nightly RLS. Evening timing targets peak symptoms, and dizziness and orthostatic hypotension are common."},{"t":"Take the dose with breakfast so it lasts all day","c":false,"r":"Symptoms peak in the evening, so evening dosing is used."},{"t":"This medicine will correct your iron deficiency","c":false,"r":"Ropinirole is a dopamine agonist. Iron replacement treats iron deficiency."},{"t":"Stop the medicine if your legs twitch during sleep","c":false,"r":"Periodic limb movements are part of RLS, not a reason to stop. Dose changes come from the provider."}],"key":"Nightly RLS: dopamine agonist first. Painful RLS: gabapentin or opioids first. Occasional RLS: levodopa.","id":46,"system":"Neuro"},{"topic":"Neuro Assessment","type":"sata","need":"Health Promotion and Maintenance","cj":"Recognize Cues","stem":"The nurse performs a neurologic assessment on an 84-year-old client. Which findings are expected age-related changes? Select all that apply.","case":null,"options":[{"t":"Diminished Achilles tendon reflexes","c":true,"r":"Deep tendon reflexes, especially the ankle jerk, decrease with age."},{"t":"Decreased vibration sense in the feet","c":true,"r":"Vibratory sense declines in the lower extremities with aging."},{"t":"Slower reaction time","c":true,"r":"Nerve conduction slows with age."},{"t":"Confusion that began suddenly yesterday","c":false,"r":"Acute confusion is delirium until proven otherwise and needs prompt evaluation. It is never a normal age change."},{"t":"New drooping on one side of the face","c":false,"r":"Unilateral facial droop is a stroke warning sign."},{"t":"Hyperactive 4+ reflexes with clonus","c":false,"r":"Hyperreflexia suggests an upper motor neuron problem. Reflexes decrease with age."}],"key":"Normal neuro aging is slower, less brisk, and less sensitive. Sudden or one-sided changes are never normal aging.","id":47,"system":"Neuro"},{"topic":"Neuro Assessment","type":"mc","need":"Health Promotion and Maintenance","cj":"Analyze Cues","stem":"While assessing a healthy 10-month-old, the nurse strokes the lateral sole of the foot and observes the great toe extending upward with fanning of the other toes. What is the nurse's best action?","case":null,"options":[{"t":"Document this as an expected finding for the infant's age","c":true,"r":"A positive Babinski reflex is normal until about 1 to 2 years of age, when the corticospinal tract matures."},{"t":"Notify the provider of a possible upper motor neuron lesion","c":false,"r":"That interpretation applies to adults and older children, not infants."},{"t":"Repeat the test on the other foot and report it if still present","c":false,"r":"A bilateral positive Babinski is expected at this age."},{"t":"Prepare the infant for an MRI of the spine","c":false,"r":"No further testing is indicated for a normal finding."}],"key":"Positive Babinski: normal in infants, abnormal in adults.","id":48,"system":"Neuro"},{"topic":"Neuro Assessment","type":"sata","need":"Reduction of Risk Potential","cj":"Take Action","stem":"A client returns to the unit after a lumbar puncture. Which actions should the nurse include in post-procedure care? Select all that apply.","case":null,"options":[{"t":"Keep the client lying flat for the time prescribed","c":true,"r":"Lying flat reduces CSF leakage and post-procedure headache."},{"t":"Encourage oral fluids unless contraindicated","c":true,"r":"Hydration helps replace CSF."},{"t":"Check the puncture site for clear drainage","c":true,"r":"Clear fluid at the site suggests a CSF leak and must be reported."},{"t":"Assess headache intensity","c":true,"r":"A headache that worsens when upright can signal a CSF leak."},{"t":"Raise the head of the bed to 45 degrees for comfort","c":false,"r":"Sitting up increases CSF leakage and headache. The client stays flat or turns side to side as ordered."},{"t":"Remove the pressure dressing after 30 minutes","c":false,"r":"The pressure dressing stays in place and is monitored for drainage."}],"key":"Post-LP: flat in bed, hydrate, pressure dressing, watch the site and headache, analgesia as needed. Normal CSF is clear and colorless.","id":49,"system":"Neuro"},{"topic":"Neuro Assessment","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"The nurse completes a neurologic exam on an adult client. Which findings are abnormal and should be reported? Select all that apply.","case":null,"options":[{"t":"Client sways and nearly falls when standing with feet together and eyes closed","c":true,"r":"A positive Romberg test indicates a balance or proprioception problem."},{"t":"Client feels touch on only one side when both sides are touched at the same time","c":true,"r":"Extinction suggests a sensory processing problem, often parietal."},{"t":"Pupils constrict when the client looks at a near object","c":false,"r":"Constriction with near focus is normal accommodation, the A in PERRLA."},{"t":"Client correctly names a coin placed in the hand with eyes closed","c":false,"r":"Intact stereognosis is normal."},{"t":"Client cannot rapidly alternate patting the thigh with the palm and back of the hand","c":true,"r":"Inability to perform rapid alternating movements indicates cerebellar dysfunction."},{"t":"Patellar reflex graded 2+","c":false,"r":"2+ is a normal reflex."}],"key":"Know your normals: PERRLA, 2+ reflexes, negative Romberg, intact stereognosis, smooth rapid alternating movements.","id":50,"system":"Neuro"},{"topic":"Cataract","type":"sata","need":"Health Promotion and Maintenance","cj":"Analyze Cues","stem":"Which factors in this client's history increase the risk for cataracts? Select all that apply.","case":{"title":"Health History","rows":[["Client","72-year-old retired landscaper"],["Medical","Rheumatoid arthritis on prednisone 10 mg daily for 8 years · type 2 diabetes · restless legs syndrome"],["Eye meds","Latanoprost 1 drop each eye at bedtime"],["Social","Smoked 1 pack per day for 30 years · rarely wore sunglasses at work"]]},"options":[{"t":"Long-term prednisone use","c":true,"r":"Long-term corticosteroids are a well-known cause of cataracts."},{"t":"Type 2 diabetes","c":true,"r":"Clients with diabetes develop cataracts at an earlier age."},{"t":"Smoking history","c":true,"r":"Smoking increases oxidative damage to lens proteins."},{"t":"Years of outdoor work without sunglasses","c":true,"r":"Prolonged UV exposure damages the lens."},{"t":"Latanoprost eye drops","c":false,"r":"Latanoprost can darken the iris and lengthen lashes, but it does not cause cataracts."},{"t":"Restless legs syndrome","c":false,"r":"Not related to cataract formation."}],"key":"Cataract risks: aging, diabetes, long-term steroids, smoking, heavy alcohol use, UV exposure, eye injury.","id":51,"system":"Eye"},{"topic":"Cataract","type":"sata","need":"Reduction of Risk Potential","cj":"Evaluate Outcomes","stem":"A client is being discharged after phacoemulsification with intraocular lens implantation. Which client statements indicate understanding of the discharge teaching? Select all that apply.","case":null,"options":[{"t":"“I'll wear the eye shield at night so I don't rub my eye while sleeping.”","c":true,"r":"Shielding prevents accidental pressure or rubbing."},{"t":"“I won't bend over at the waist or lift anything heavy until my surgeon says it's okay.”","c":true,"r":"Bending and lifting raise intraocular pressure."},{"t":"“I'll take a stool softener so I don't strain.”","c":true,"r":"Straining (Valsalva) increases IOP."},{"t":"“I'll call right away if I have sudden severe pain or my vision suddenly gets worse.”","c":true,"r":"These can signal hemorrhage, infection, or increased IOP."},{"t":"“If my eye itches, I'll rub it gently with a clean tissue.”","c":false,"r":"Rubbing can disrupt the incision and lens. Pressure on the eye is avoided."},{"t":"“I can stop my steroid drops as soon as my eye stops looking red.”","c":false,"r":"Antibiotic and steroid drops are completed as prescribed to prevent infection and control inflammation."}],"key":"After cataract surgery: no rubbing, bending, lifting, coughing, or straining. Shield at night. Finish the drops. Report sudden pain, vision loss, or increased redness or drainage.","id":52,"system":"Eye"},{"topic":"Cataract","type":"mc","need":"Reduction of Risk Potential","cj":"Take Action","stem":"A client who had cataract surgery 3 hours ago reports nausea. What is the nurse's priority action?","case":null,"options":[{"t":"Give the prescribed antiemetic","c":true,"r":"Vomiting sharply increases intraocular pressure and can damage the surgical site. Preventing it is the priority."},{"t":"Encourage the client to cough and deep breathe","c":false,"r":"Coughing raises IOP and is avoided after eye surgery."},{"t":"Position the client on the operative side","c":false,"r":"Clients usually lie on the back or the nonoperative side to avoid pressure on the eye."},{"t":"Offer a large glass of water","c":false,"r":"This could worsen nausea and does not prevent vomiting."}],"key":"After eye surgery, anything that raises IOP is a problem: vomiting, coughing, straining, bending, lifting.","id":53,"system":"Eye"},{"topic":"Glaucoma","type":"sata","need":"Physiological Adaptation","cj":"Take Action","stem":"Based on the triage note, which interventions should the nurse anticipate? Select all that apply.","case":{"title":"ED Triage Note · 2140","rows":[["Client","68-year-old female"],["Onset","Sudden severe pain in the right eye that began while watching a movie in a dark theater"],["Associated","Nausea, vomited twice, sees colored halos around lights"],["Exam","Right eye red, cornea cloudy, pupil mid-dilated and nonreactive"],["IOP","Right eye 56 mm Hg · left eye 17 mm Hg"]]},"options":[{"t":"Give acetazolamide IV or orally","c":true,"r":"Carbonic anhydrase inhibitors lower IOP quickly by decreasing aqueous humor production."},{"t":"Give an IV hyperosmotic agent such as mannitol","c":true,"r":"Osmotic agents pull fluid out of the eye and rapidly reduce IOP."},{"t":"Instill a miotic such as pilocarpine as prescribed","c":true,"r":"Constricting the pupil pulls the iris away from the drainage angle."},{"t":"Instill atropine to relieve eye pain","c":false,"r":"Mydriatics dilate the pupil and worsen angle closure. They are contraindicated."},{"t":"Prepare the client for laser peripheral iridotomy","c":true,"r":"Creating an opening in the iris treats the attack and prevents recurrence."},{"t":"Schedule an ophthalmology follow-up for next week","c":false,"r":"Acute angle-closure glaucoma is an emergency. Permanent vision loss can occur within hours."}],"key":"AACG: sudden severe pain, halos, nausea and vomiting, IOP often above 50. Lower IOP now, constrict the pupil, never dilate, then iridotomy.","id":54,"system":"Eye"},{"topic":"Glaucoma","type":"mc","need":"Pharmacological Therapies","cj":"Evaluate Outcomes","stem":"The nurse is teaching a client newly diagnosed with primary open-angle glaucoma. Which statement indicates a need for further teaching?","case":null,"options":[{"t":"“Once my eye pressure is normal, I can stop using the drops.”","c":true,"r":"POAG has no cure. Drops control IOP only while they are used, so therapy is lifelong."},{"t":"“The vision I've already lost will not come back.”","c":false,"r":"Correct. Optic nerve damage is permanent."},{"t":"“I probably won't notice symptoms even if my pressure goes up.”","c":false,"r":"Correct. POAG is painless and progresses silently."},{"t":"“I'll need regular eye pressure checks for the rest of my life.”","c":false,"r":"Correct. Ongoing monitoring guides therapy."}],"key":"POAG is silent and lifelong. Drops control it but never cure it, and lost vision does not return.","id":55,"system":"Eye"},{"topic":"Glaucoma","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"Which findings are consistent with primary open-angle glaucoma? Select all that apply.","case":null,"options":[{"t":"IOP of 27 mm Hg","c":true,"r":"In POAG, IOP is usually 22 to 32 mm Hg. Normal is 10 to 21 mm Hg."},{"t":"Gradual loss of peripheral vision","c":true,"r":"Peripheral field loss that progresses to tunnel vision is typical."},{"t":"Increased cupping of the optic disc","c":true,"r":"Optic nerve damage appears as cupping on ophthalmoscopy."},{"t":"Sudden severe eye pain with vomiting","c":false,"r":"This describes acute angle-closure glaucoma."},{"t":"Straight lines that appear wavy","c":false,"r":"Metamorphopsia is a sign of macular degeneration."}],"key":"POAG: painless, gradual peripheral loss, IOP 22 to 32, optic disc cupping. Second leading cause of blindness.","id":56,"system":"Eye"},{"topic":"Glaucoma","type":"mc","need":"Management of Care","cj":"Prioritize Hypotheses","stem":"The nurse in an eye clinic receives four phone messages. Which client should the nurse call back first?","case":null,"options":[{"t":"A client with sudden severe eye pain, halos around lights, and vomiting","c":true,"r":"These are signs of acute angle-closure glaucoma, an emergency that can cause permanent vision loss within hours."},{"t":"A client 1 day after cataract surgery who asks when she can wash her hair","c":false,"r":"A routine teaching question."},{"t":"A client with dry macular degeneration who wants to know about vitamin supplements","c":false,"r":"A nonurgent teaching need."},{"t":"A client with keratitis who reports mild itching after starting antiviral drops","c":false,"r":"Mild irritation from drops is not urgent."}],"key":"Eye emergencies: acute angle-closure glaucoma, retinal detachment, chemical burns, penetrating injuries.","id":57,"system":"Eye"},{"topic":"Eye Medications","type":"mc","need":"Pharmacological Therapies","cj":"Generate Solutions","stem":"Before cataract surgery, a client receives phenylephrine and cyclopentolate eye drops. Which instruction should the nurse give?","case":null,"options":[{"t":"“Your vision will be blurry and bright light will bother you for several hours, so wear dark glasses and do not drive.”","c":true,"r":"Mydriatics dilate the pupil and cycloplegics paralyze accommodation, which causes blurred vision and photophobia."},{"t":"“These drops will make your pupil smaller so the surgeon can see the lens.”","c":false,"r":"These drops dilate the pupil."},{"t":"“These drops lower your eye pressure for surgery.”","c":false,"r":"They are given to dilate the pupil and relax the ciliary muscle."},{"t":"“You'll be able to read normally right after these drops.”","c":false,"r":"Cycloplegia paralyzes accommodation, so close reading will be difficult."}],"key":"Mydriatics (alpha-adrenergic agonists like phenylephrine) dilate. Cycloplegics block acetylcholine, paralyze focusing, and also dilate. Teach dark glasses and no driving.","id":58,"system":"Eye"},{"topic":"Eye Medications","type":"sata","need":"Pharmacological Therapies","cj":"Take Action","stem":"The nurse is teaching a client how to instill glaucoma eye drops. Which instructions should be included? Select all that apply.","case":null,"options":[{"t":"Wash your hands before instilling the drops","c":true,"r":"Hand hygiene prevents eye infection."},{"t":"Place the drop in the pocket of the lower lid","c":true,"r":"The conjunctival sac holds the drop and avoids the sensitive cornea."},{"t":"Press gently on the inner corner of the eye for 1 to 2 minutes after the drop","c":true,"r":"Punctal occlusion keeps the drug in the eye and reduces systemic absorption, which matters with beta-blockers."},{"t":"Wait at least 5 minutes between different eye drops","c":true,"r":"Waiting keeps the second drop from washing out the first."},{"t":"Touch the dropper tip to the eyelashes to steady your aim","c":false,"r":"Touching the tip contaminates the bottle."},{"t":"Squeeze the eyes shut tightly after the drop goes in","c":false,"r":"Squeezing forces medication out. Close the eye gently."}],"key":"Eye drops: clean hands, lower lid pocket, no tip contact, gentle closure, punctal pressure, 5 minutes between different drops.","id":59,"system":"Eye"},{"topic":"Eye Medications","type":"mc","need":"Pharmacological Therapies","cj":"Recognize Cues","stem":"A client with glaucoma uses timolol eye drops. Which finding should the nurse report to the provider?","case":null,"options":[{"t":"Heart rate of 48 beats/min with new wheezing","c":true,"r":"Systemic absorption of a beta-blocker can cause bradycardia and bronchospasm. Clients with asthma, COPD, heart block, or heart failure are at higher risk."},{"t":"Mild stinging when the drop is instilled","c":false,"r":"Brief eye discomfort is a common, minor effect."},{"t":"Blood pressure of 124/76 mm Hg","c":false,"r":"Within normal limits."},{"t":"Gradual darkening of the iris","c":false,"r":"This is an effect of prostaglandin analogs, not timolol."}],"key":"Beta-blocker eye drops can still slow the heart and tighten the airways. Always ask about heart and lung disease and other beta-blockers.","id":60,"system":"Eye"},{"topic":"Eye Medications","type":"mc","need":"Pharmacological Therapies","cj":"Evaluate Outcomes","stem":"A client with open-angle glaucoma is prescribed latanoprost. Which statement indicates understanding of the teaching?","case":null,"options":[{"t":"“My eye color may slowly turn more brown, and that change may be permanent.”","c":true,"r":"Prostaglandin analogs can permanently increase brown pigment in the iris and lengthen and darken eyelashes."},{"t":"“I'll put in a drop every 2 hours while I'm awake.”","c":false,"r":"Latanoprost is given once daily, usually in the evening."},{"t":"“This medicine works by making my pupil smaller.”","c":false,"r":"Latanoprost increases uveoscleral outflow of aqueous humor. Miotics constrict the pupil."},{"t":"“I'll leave my contact lenses in when I use the drops.”","c":false,"r":"Contacts are removed before instillation and reinserted after about 15 minutes."}],"key":"Prostaglandin analogs (latanoprost): once daily at bedtime, increase outflow, may darken the iris and lengthen lashes.","id":61,"system":"Eye"},{"topic":"Eye Medications","type":"sata","need":"Pharmacological Therapies","cj":"Generate Solutions","stem":"A client with glaucoma is prescribed pilocarpine eye drops. Which information should the nurse include in teaching? Select all that apply.","case":null,"options":[{"t":"Vision may be poor in dim light, so use caution driving at night","c":true,"r":"Miosis limits how much light enters the eye."},{"t":"Brow ache and blurred vision are common at first","c":true,"r":"Ciliary muscle spasm causes these effects, which usually lessen."},{"t":"The drug lowers eye pressure by increasing drainage of aqueous humor","c":true,"r":"Pupil constriction opens the drainage pathway and increases outflow."},{"t":"Report sweating, drooling, or stomach cramps","c":true,"r":"Systemic absorption can cause cholinergic effects."},{"t":"The drug works by dilating the pupil","c":false,"r":"Pilocarpine is a cholinergic miotic. It constricts the pupil."}],"key":"Miotics (cholinergic) constrict the pupil and increase outflow. Watch for poor night vision and cholinergic side effects.","id":62,"system":"Eye"},{"topic":"Eye Medications","type":"sata","need":"Pharmacological Therapies","cj":"Recognize Cues","stem":"A client with glaucoma is prescribed oral acetazolamide. Which assessments are appropriate for the nurse to include? Select all that apply.","case":null,"options":[{"t":"Ask about allergy to sulfonamide drugs","c":true,"r":"Acetazolamide is a sulfonamide derivative, so cross-sensitivity can occur."},{"t":"Ask about tingling in the fingers and toes","c":true,"r":"Paresthesias are a common adverse effect."},{"t":"Monitor serum potassium","c":true,"r":"Carbonic anhydrase inhibitors increase potassium loss in the urine."},{"t":"Ask about flank pain or blood in the urine","c":true,"r":"Kidney stones are a known adverse effect."},{"t":"Monitor for bradycardia and wheezing","c":false,"r":"These are systemic effects of beta-blocker drops such as timolol."},{"t":"Check for darkening of the iris","c":false,"r":"This is an effect of prostaglandin analogs."}],"key":"Acetazolamide: check sulfa allergy. Watch for paresthesias, low potassium, kidney stones, tinnitus or hearing changes, GI upset, drowsiness, depression.","id":63,"system":"Eye"},{"topic":"Eye Medications","type":"mc","need":"Pharmacological Therapies","cj":"Take Action","stem":"A prescription is received to instill atropine 1% drops before an eye examination. Which finding in the client's history requires the nurse to question the order?","case":null,"options":[{"t":"Narrow anterior chamber angles","c":true,"r":"Cycloplegic mydriatics dilate the pupil and can trigger acute angle-closure glaucoma in clients with narrow angles."},{"t":"Myopia corrected with glasses","c":false,"r":"Not a contraindication."},{"t":"Seasonal allergies","c":false,"r":"Not a contraindication."},{"t":"A corneal abrasion 2 years ago that healed","c":false,"r":"Not a contraindication."}],"key":"Never dilate a narrow angle. Mydriatics and cycloplegics are contraindicated with angle-closure risk.","id":64,"system":"Eye"},{"topic":"Eye Medications","type":"sata","need":"Pharmacological Therapies","cj":"Recognize Cues","stem":"An older adult received several doses of cyclopentolate eye drops before a retinal exam. Which findings suggest systemic anticholinergic toxicity? Select all that apply.","case":null,"options":[{"t":"Heart rate of 122 beats/min","c":true,"r":"Anticholinergic effects cause tachycardia."},{"t":"New confusion and restlessness","c":true,"r":"CNS effects such as confusion and hallucinations occur, especially in older adults and children."},{"t":"Hot, flushed, dry skin","c":true,"r":"Anticholinergics block sweating."},{"t":"Dry mouth","c":true,"r":"Salivation is reduced."},{"t":"Difficulty passing urine","c":true,"r":"Anticholinergics cause urinary retention."},{"t":"Increased tearing and drooling","c":false,"r":"These are cholinergic effects, the opposite of anticholinergic toxicity."}],"key":"Anticholinergic toxicity: hot as a hare, dry as a bone, red as a beet, mad as a hatter, full as a flask, fast heart.","id":65,"system":"Eye"},{"topic":"Eye Medications","type":"sata","need":"Reduction of Risk Potential","cj":"Generate Solutions","stem":"A client is scheduled for fluorescein angiography. Which information should the nurse provide? Select all that apply.","case":null,"options":[{"t":"The dye is injected into a vein in the arm or hand","c":true,"r":"Fluorescein for angiography is given IV, followed by serial photographs of the retina."},{"t":"Your skin and urine may look yellow-orange for a short time","c":true,"r":"This temporary discoloration is expected."},{"t":"You may feel briefly nauseated after the dye is injected","c":true,"r":"Transient nausea or vomiting can occur and does not by itself mean an allergic reaction."},{"t":"Your pupils will be dilated, so arrange for someone to drive you home","c":true,"r":"Dilation causes blurred vision and light sensitivity for several hours."},{"t":"Tell the nurse right away if the IV site burns or swells","c":true,"r":"Fluorescein that leaks into tissue is toxic, so extravasation must be caught early."},{"t":"The dye is radioactive, so avoid close contact with others for 24 hours","c":false,"r":"Fluorescein is not radioactive."}],"key":"Fluorescein angiography: IV dye, dilated pupils, transient nausea, yellow-orange skin and urine, protect the IV site.","id":66,"system":"Eye"},{"topic":"Eye Medications","type":"sata","need":"Pharmacological Therapies","cj":"Analyze Cues","stem":"Which glaucoma medications are correctly matched with how they lower intraocular pressure? Select all that apply.","case":null,"options":[{"t":"Timolol: decreases aqueous humor production","c":true,"r":"Beta-blockers reduce aqueous production."},{"t":"Latanoprost: increases outflow of aqueous humor","c":true,"r":"Prostaglandin analogs increase uveoscleral outflow."},{"t":"Pilocarpine: dilates the pupil to widen the drainage angle","c":false,"r":"Pilocarpine is a cholinergic miotic. It constricts the pupil, which pulls the iris away from the angle and increases outflow."},{"t":"Dorzolamide: increases aqueous humor production","c":false,"r":"Carbonic anhydrase inhibitors decrease aqueous production."},{"t":"Brimonidine: decreases aqueous humor production","c":true,"r":"Alpha-adrenergic agonists reduce production and may also increase outflow."},{"t":"Atropine: opens the angle in angle-closure glaucoma","c":false,"r":"Atropine dilates the pupil and can close the angle further."}],"key":"Decrease production: beta-blockers, alpha agonists, carbonic anhydrase inhibitors. Increase outflow: prostaglandin analogs, miotics.","id":67,"system":"Eye"},{"topic":"Corneal Disorders","type":"sata","need":"Physiological Adaptation","cj":"Take Action","stem":"Based on the clinic note, which actions should the nurse anticipate? Select all that apply.","case":{"title":"Clinic Note","rows":[["Client","24-year-old who sleeps in extended-wear contact lenses"],["Complaint","Right eye pain for 2 days, light sensitivity, tearing, yellow drainage"],["Client states","“It feels like something is stuck in my eye.”"],["Exam","Conjunctiva red, small white opacity on the cornea, visual acuity 20/50 right eye"]]},"options":[{"t":"Remove the contact lens and do not reinsert it","c":true,"r":"The lens may harbor organisms and must stay out. The lens and case may be cultured."},{"t":"Obtain corneal scrapings for culture","c":true,"r":"Cultures identify the organism and guide antimicrobial choice."},{"t":"Teach the client to give antibiotic drops every hour, including overnight, for the first 24 hours","c":true,"r":"Aggressive dosing prevents corneal perforation and permanent vision loss."},{"t":"Apply a tight pressure patch over the eye","c":false,"r":"Patching an infected eye, especially with contact lens use, creates a warm, dark environment that promotes bacterial growth."},{"t":"Send the client home with topical anesthetic drops for pain","c":false,"r":"Repeated anesthetic use delays healing and masks worsening damage."},{"t":"Tell the client to resume contact lens wear once the pain stops","c":false,"r":"Lenses stay out until the provider confirms healing. Pain relief does not mean the ulcer has resolved, and close follow-up is essential."}],"key":"Contact lens wearer with a painful red eye and discharge has a corneal ulcer until proven otherwise. Hourly drops, no patch, no take-home anesthetic.","id":68,"system":"Eye"},{"topic":"Corneal Disorders","type":"mc","need":"Pharmacological Therapies","cj":"Take Action","stem":"A client has herpes simplex keratitis with a branching (dendritic) corneal ulcer. Which prescription should the nurse question?","case":null,"options":[{"t":"Prednisolone acetate eye drops","c":true,"r":"Topical corticosteroids can worsen HSV keratitis and increase the risk of corneal perforation."},{"t":"Trifluridine eye drops","c":false,"r":"A topical antiviral used for HSV keratitis."},{"t":"Oral acyclovir","c":false,"r":"An oral antiviral used for HSV keratitis."},{"t":"Ganciclovir ophthalmic gel","c":false,"r":"A topical antiviral used for HSV keratitis."}],"key":"HSV keratitis: tree-branching ulcer, pain and photophobia, treat with antivirals, avoid steroids.","id":69,"system":"Eye"},{"topic":"Corneal Disorders","type":"sata","need":"Health Promotion and Maintenance","cj":"Generate Solutions","stem":"A client is diagnosed with a corneal abrasion after being scratched by a tree branch. Which discharge instructions should the nurse give? Select all that apply.","case":null,"options":[{"t":"Use the antibiotic drops or ointment exactly as prescribed","c":true,"r":"Prophylactic antibiotics prevent infection of the damaged epithelium."},{"t":"Avoid rubbing the eye","c":true,"r":"Rubbing can enlarge the abrasion."},{"t":"Do not wear contact lenses until the provider says the eye has healed","c":true,"r":"Lenses increase infection risk and slow healing."},{"t":"Use the numbing drops from the clinic whenever the eye hurts","c":false,"r":"Topical anesthetics are not sent home because repeated use damages the cornea and delays healing."},{"t":"Return if pain increases, drainage develops, or vision worsens","c":true,"r":"These may signal infection or ulceration."},{"t":"Wear protective eyewear when doing yard work","c":true,"r":"Preventing future eye trauma is part of eye health teaching."}],"key":"Corneal abrasion: antibiotics, no rubbing, no contacts, no take-home anesthetic drops, protective eyewear.","id":70,"system":"Eye"},{"topic":"Corneal Disorders","type":"mc","need":"Pharmacological Therapies","cj":"Generate Solutions","stem":"A client with a bacterial corneal ulcer is prescribed antibiotic drops every hour for 24 hours. The client asks whether it is okay to skip the overnight doses to get some sleep. What is the nurse's best response?","case":null,"options":[{"t":"“The drops need to be given around the clock for the first day to stop the infection before it damages the cornea.”","c":true,"r":"Undertreated corneal ulcers can scar or perforate and cause permanent vision loss."},{"t":"“Skipping a few doses at night is fine as long as you double the morning dose.”","c":false,"r":"Doubling doses does not replace steady drug levels on the cornea."},{"t":"“You can switch to drops 4 times a day once the pain improves.”","c":false,"r":"Changes to the regimen must come from the provider."},{"t":"“Patch the eye at night instead of using the drops.”","c":false,"r":"Patching is contraindicated with infection and does not treat the ulcer."}],"key":"Corneal ulcers are treated aggressively, with hourly drops around the clock at first. A transplant may be needed if treatment fails.","id":71,"system":"Eye"},{"topic":"Macular Degeneration","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"Which findings would the nurse expect in a client with age-related macular degeneration? Select all that apply.","case":null,"options":[{"t":"Yellow deposits (drusen) seen on the retina","c":true,"r":"Drusen are the early sign of dry AMD."},{"t":"A dark or blind spot in the center of vision","c":true,"r":"Central scotomas result from macular damage."},{"t":"Straight lines that look wavy or bent","c":true,"r":"Metamorphopsia is a classic AMD finding."},{"t":"Loss of peripheral vision first","c":false,"r":"Peripheral loss first is typical of glaucoma. AMD affects central vision."},{"t":"Severe eye pain","c":false,"r":"AMD is painless."},{"t":"New flashes of light and a shower of floaters","c":false,"r":"Flashes and floaters suggest retinal detachment. In AMD, peripheral vision is preserved and the loss is central and painless."}],"key":"AMD takes the center. Glaucoma takes the edges.","id":72,"system":"Eye"},{"topic":"Macular Degeneration","type":"mc","need":"Health Promotion and Maintenance","cj":"Evaluate Outcomes","stem":"The nurse teaches a client with dry AMD to use an Amsler grid at home. Which statement indicates correct understanding?","case":null,"options":[{"t":"“I'll cover one eye, look at the center dot, and call right away if any lines look wavy or missing.”","c":true,"r":"Testing each eye separately at 12 to 15 inches and reporting new distortion promptly can catch conversion to wet AMD early."},{"t":"“I'll look at the grid with both eyes open so I can see it better.”","c":false,"r":"Each eye is tested separately, or the better eye hides changes in the other."},{"t":"“I only need to check the grid once a year before my eye exam.”","c":false,"r":"The grid is used regularly at home to detect changes early."},{"t":"“If a few lines look bent, I'll mention it at my next visit.”","c":false,"r":"New distortion may mean wet AMD and needs prompt evaluation."}],"key":"Amsler grid: one eye at a time, 12 to 15 inches away, focus on the center dot, report new distortion promptly.","id":73,"system":"Eye"},{"topic":"Macular Degeneration","type":"sata","need":"Pharmacological Therapies","cj":"Generate Solutions","stem":"A client with wet AMD is starting treatment. Which information should the nurse include? Select all that apply.","case":null,"options":[{"t":"Anti-VEGF drugs such as ranibizumab are injected into the eye every 4 to 6 weeks","c":true,"r":"These drugs block VEGF to halt abnormal blood vessel growth and slow vision loss."},{"t":"Avoid direct sunlight for 5 days after photodynamic therapy with verteporfin","c":true,"r":"The light-activated drug remains in the skin and can cause burns with sun exposure."},{"t":"Supplements with vitamins C and E, zinc, and lutein may help slow progression","c":true,"r":"Antioxidant supplements are recommended for some clients with AMD."},{"t":"Eat dark green leafy vegetables such as spinach and kale","c":true,"r":"These foods are rich in lutein."},{"t":"The injections will restore the central vision you have already lost","c":false,"r":"Treatment slows loss and may stabilize vision, but most lost vision does not return."}],"key":"Wet AMD: anti-VEGF injections, photodynamic therapy with sun avoidance, supplements, leafy greens, smoking cessation, low vision support.","id":74,"system":"Eye"},{"topic":"Macular Degeneration","type":"mc","need":"Psychosocial Integrity","cj":"Generate Solutions","stem":"An 81-year-old client with advanced AMD who lives alone tells the nurse, “I can't read my mail or recognize faces anymore. I've stopped going to church.” What is the most appropriate nursing action?","case":null,"options":[{"t":"Encourage the client to talk about the loss and refer to low vision rehabilitation","c":true,"r":"Vision loss causes grief, isolation, and depression. Low vision services provide magnifiers, large-print and talking devices, and strategies to stay independent and involved."},{"t":"Reassure the client that new glasses will restore reading vision","c":false,"r":"AMD vision loss cannot be corrected with glasses. False reassurance is not therapeutic."},{"t":"Suggest that the client move into a nursing home","c":false,"r":"Premature, and it does not address the client's needs or independence."},{"t":"Ask a family member to take over the client's mail and finances","c":false,"r":"This reduces independence without first exploring adaptive options."}],"key":"Vision loss is a real loss. Let the client grieve, then help them adapt with low vision resources.","id":75,"system":"Eye"},{"topic":"Retinal Detachment","type":"sata","need":"Physiological Adaptation","cj":"Recognize Cues","stem":"Which symptoms reported by a client should make the nurse suspect retinal detachment? Select all that apply.","case":null,"options":[{"t":"Sudden flashes of light","c":true,"r":"Flashes occur as the vitreous pulls on the retina."},{"t":"A sudden shower of new floaters","c":true,"r":"Floaters can come from blood or debris released when the retina tears."},{"t":"A shadow or curtain moving across part of the vision","c":true,"r":"This is the classic description of a detaching retina."},{"t":"Severe throbbing eye pain","c":false,"r":"Retinal detachment is painless."},{"t":"Gradual blurring of central vision over several years","c":false,"r":"This is more typical of macular degeneration or cataracts."}],"key":"Retinal detachment: flashes, floaters, curtain. Painless. Emergency.","id":76,"system":"Eye"},{"topic":"Retinal Detachment","type":"mc","need":"Management of Care","cj":"Take Action","stem":"A client calls the clinic and says, “For the past hour I've seen flashing lights and lots of new black spots, and now it looks like a curtain is coming down over my left eye.” What should the nurse tell the client?","case":null,"options":[{"t":"“Go to an eye emergency department or your ophthalmologist right away.”","c":true,"r":"Retinal detachment is an emergency. Prompt repair improves the chance of saving vision, especially before the macula detaches."},{"t":"“Lie down in a dark room and call back if it hasn't improved by tomorrow.”","c":false,"r":"Delaying treatment risks permanent vision loss."},{"t":"“Apply a warm compress and use lubricating drops.”","c":false,"r":"This does not address a detaching retina."},{"t":"“Check your Amsler grid tonight and report changes at your next visit.”","c":false,"r":"The Amsler grid monitors macular disease and is not appropriate for acute symptoms."}],"key":"Flashes, floaters, and a curtain mean same-day emergency evaluation.","id":77,"system":"Eye"},{"topic":"Retinal Detachment","type":"mc","need":"Reduction of Risk Potential","cj":"Evaluate Outcomes","stem":"A client had pneumatic retinopexy with an intravitreal gas bubble. Which statement indicates the client understands the discharge teaching?","case":null,"options":[{"t":"“I won't fly or drive up into the mountains until my surgeon says the gas bubble is gone.”","c":true,"r":"Changes in altitude make the gas bubble expand, which can sharply raise intraocular pressure."},{"t":"“I'll lie flat on my back so the bubble stays in place.”","c":false,"r":"The client must keep the specific head position prescribed, often face down, so the bubble presses against the retinal break. Lying on the back can move the bubble away from it."},{"t":"“I can go back to my weightlifting routine tomorrow.”","c":false,"r":"Heavy lifting and straining are restricted after retinal repair."},{"t":"“The bubble will be gone by tonight, so positioning doesn't matter.”","c":false,"r":"Gas bubbles last days to weeks, and positioning is maintained as ordered."}],"key":"Gas bubble: keep the prescribed head position, no air travel or high altitude, no heavy lifting or straining.","id":78,"system":"Eye"},{"topic":"Retinal Detachment","type":"sata","need":"Health Promotion and Maintenance","cj":"Generate Solutions","stem":"Which instructions should the nurse include in discharge teaching for a client after surgical repair of a retinal detachment? Select all that apply.","case":null,"options":[{"t":"Maintain the head position prescribed by the surgeon","c":true,"r":"Positioning keeps the gas bubble or repair in place."},{"t":"Avoid heavy lifting, bending, and straining","c":true,"r":"These raise intraocular pressure and can disrupt the repair."},{"t":"Know the warning signs of retinal detachment in the other eye","c":true,"r":"Clients with one detachment are at higher risk in the other eye."},{"t":"Return to contact sports as soon as the eye feels comfortable","c":false,"r":"Activity restrictions continue until the surgeon clears the client."},{"t":"Wear protective eyewear to prevent future eye trauma","c":true,"r":"Trauma is a risk factor for detachment."}],"key":"After RD repair: positioning, activity restrictions, drops as prescribed, protective eyewear, watch the other eye.","id":79,"system":"Eye"},{"topic":"Refractive Errors","type":"sata","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"Which statements about refractive errors are accurate? Select all that apply.","case":null,"options":[{"t":"In myopia, light focuses in front of the retina, so distant objects are blurry","c":true,"r":"Nearsightedness: near objects are clear, far ones are blurry."},{"t":"In hyperopia, light focuses behind the retina, so near objects are blurry","c":true,"r":"Farsightedness: distant objects are clearer than near ones."},{"t":"Presbyopia results from the lens becoming less flexible with age","c":true,"r":"Loss of accommodation usually begins around age 45."},{"t":"Astigmatism causes blurred or distorted vision at all distances","c":true,"r":"An unevenly curved cornea or lens bends light unevenly."},{"t":"Eyestrain, squinting, and headaches are common symptoms","c":true,"r":"Blurred vision is the major symptom, and eyestrain and headaches often come with it."}],"key":"Myopia: can't see far. Hyperopia: can't see near. Presbyopia: can't see near because of age. Astigmatism: blurry at every distance. Every statement here is true, and that can happen on SATA items.","id":80,"system":"Eye"},{"topic":"Refractive Errors","type":"mc","need":"Health Promotion and Maintenance","cj":"Analyze Cues","stem":"A healthy 47-year-old client says, “I have to hold my phone at arm's length to read texts now.” Which explanation by the nurse is accurate?","case":null,"options":[{"t":"“As we age, the lens gets less flexible and can't focus up close as well. Reading glasses usually help.”","c":true,"r":"This describes presbyopia, an expected change that begins around 45."},{"t":"“Your eyeball is too long, so light focuses in front of your retina.”","c":false,"r":"This describes myopia, which affects distance vision."},{"t":"“Your cornea is curved unevenly, which blurs everything.”","c":false,"r":"This describes astigmatism."},{"t":"“This is an early sign that your retina is detaching.”","c":false,"r":"Retinal detachment causes flashes, floaters, and a curtain, not a gradual change in near vision."}],"key":"Mid-40s and trouble reading up close: presbyopia.","id":81,"system":"Eye"},{"topic":"Vision Assessment & Care","type":"sata","need":"Health Promotion and Maintenance","cj":"Recognize Cues","stem":"The nurse is performing an eye assessment on an 80-year-old client. Which findings are expected age-related changes? Select all that apply.","case":null,"options":[{"t":"Dry, irritated eyes from decreased tear production","c":true,"r":"Tear secretion declines with age."},{"t":"Yellowing and clouding of the lens","c":true,"r":"Lens opacities develop with aging."},{"t":"Reduced ability to tell some colors apart","c":true,"r":"The number of cones decreases with age, and the yellowing lens filters blue tones."},{"t":"Sudden painless loss of vision in one eye","c":false,"r":"Sudden vision loss is never normal and needs emergency evaluation."},{"t":"Larger pupils that react briskly to light","c":false,"r":"Pupils become smaller and slower with age."},{"t":"Better night vision than when younger","c":false,"r":"Dark adaptation declines with age, so night vision worsens."}],"key":"Aging eyes: dry, cloudy and yellow lens, smaller slower pupils, poorer color vision and dark adaptation. Sudden change is not aging.","id":82,"system":"Eye"},{"topic":"Vision Assessment & Care","type":"mc","need":"Health Promotion and Maintenance","cj":"Analyze Cues","stem":"A client's visual acuity in the right eye is recorded as 20/60 on the Snellen chart. How should the nurse interpret this finding?","case":null,"options":[{"t":"The client sees at 20 feet what a person with normal vision can see at 60 feet","c":true,"r":"The top number is the testing distance. The bottom number is the distance at which a normal eye could read that line, so larger bottom numbers mean poorer acuity."},{"t":"The client sees at 60 feet what a person with normal vision can see at 20 feet","c":false,"r":"This reverses the meaning and would describe better than normal vision."},{"t":"The client has 60% of normal vision","c":false,"r":"Snellen values are not percentages."},{"t":"The client is legally blind in that eye","c":false,"r":"Legal blindness is 20/200 or worse in the better eye with correction."}],"key":"Snellen: top number is the distance tested (20 ft), bottom number is the distance a normal eye could read that line. Jaeger chart at 14 inches tests near vision.","id":83,"system":"Eye"},{"topic":"Vision Assessment & Care","type":"sata","need":"Psychosocial Integrity","cj":"Take Action","stem":"A client with severe visual impairment is admitted to the medical unit. Which nursing actions promote safety and independence? Select all that apply.","case":null,"options":[{"t":"Say your name when entering the room and tell the client when you are leaving","c":true,"r":"This prevents startling the client and keeps them oriented to who is present."},{"t":"Orient the client to the room and keep furniture in the same place","c":true,"r":"A consistent layout lets the client move around safely and independently."},{"t":"Describe the location of food using a clock face","c":true,"r":"For example, chicken at 3 o'clock lets the client feed themselves."},{"t":"Grasp the client's arm and steer them while walking","c":false,"r":"The client holds the nurse's arm just above the elbow while the nurse walks half a step ahead."},{"t":"Speak loudly so the client knows you are talking to them","c":false,"r":"Vision loss does not affect hearing. Use a normal tone and address the client directly."},{"t":"Encourage the client to do self-care as able","c":true,"r":"Promoting independence supports self-esteem and adaptation."}],"key":"Visual impairment: announce yourself, keep the room consistent, clock-face food, sighted guide technique, normal voice, support independence.","id":84,"system":"Eye"},{"topic":"Vision Assessment & Care","type":"sata","need":"Health Promotion and Maintenance","cj":"Generate Solutions","stem":"The nurse is teaching a community group about eye health. Which recommendations should the nurse include? Select all that apply.","case":null,"options":[{"t":"Adults with diabetes need a dilated eye exam at least once a year","c":true,"r":"Annual dilated exams catch diabetic retinopathy early."},{"t":"Wear safety glasses when using power tools or chemicals","c":true,"r":"Protective eyewear prevents most eye injuries."},{"t":"Wear sunglasses that block UV light","c":true,"r":"UV protection lowers the risk of cataracts and AMD."},{"t":"Quit smoking","c":true,"r":"Smoking increases the risk of AMD and cataracts."},{"t":"Adults only need an eye exam when they notice a vision change","c":false,"r":"Glaucoma and early retinopathy are often silent. Routine exams catch disease before vision is lost."},{"t":"Adults 65 and older should have an eye exam every 1 to 2 years","c":true,"r":"The risk of cataracts, glaucoma, and AMD rises with age."}],"key":"Eye health: UV protection, safety eyewear, no smoking, yearly dilated exams with diabetes, regular exams that get more frequent with age, hand hygiene with contacts.","id":85,"system":"Eye"},{"topic":"Otitis Media","type":"sata","need":"Health Promotion and Maintenance","cj":"Generate Solutions","stem":"The nurse is teaching the parent of an 18-month-old with acute otitis media. Which instructions should be included? Select all that apply.","case":null,"options":[{"t":"Give the full course of antibiotics even if the child seems better","c":true,"r":"Stopping early can lead to recurrence and resistance."},{"t":"Use acetaminophen or ibuprofen as directed for pain and fever","c":true,"r":"Pain control is a key part of treatment."},{"t":"Hold the child upright for bottle feedings and never prop the bottle","c":true,"r":"Feeding lying down lets fluid reach the eustachian tube, which is shorter and more horizontal in young children."},{"t":"Keep the child away from cigarette smoke","c":true,"r":"Secondhand smoke irritates the eustachian tube and increases OM risk."},{"t":"Clean the ear canal with a cotton-tipped swab after each dose","c":false,"r":"Swabs can push debris deeper and injure the canal or eardrum."},{"t":"Keep immunizations up to date","c":true,"r":"Influenza and pneumococcal vaccines lower the risk of OM."}],"key":"OM prevention: upright feeding, no bottle propping, breastfeeding, no smoke exposure, vaccines. If antibiotics are prescribed, finish them.","id":86,"system":"Ear"},{"topic":"Otitis Media","type":"mc","need":"Health Promotion and Maintenance","cj":"Evaluate Outcomes","stem":"A child has tympanostomy tubes placed for recurrent otitis media. Which statement by the parent indicates understanding of the discharge teaching?","case":null,"options":[{"t":"“I'll call the provider if I see drainage coming from her ear.”","c":true,"r":"Drainage may mean infection and should be reported."},{"t":"“She'll need another surgery next week to take the tubes out.”","c":false,"r":"Tubes usually fall out on their own within months."},{"t":"“The tubes will cure any hearing loss permanently.”","c":false,"r":"Tubes ventilate the middle ear and drain fluid but do not guarantee permanent hearing improvement."},{"t":"“I'll push cotton swabs into her ears to keep water out.”","c":false,"r":"Swabs can damage the tubes and canal. Follow the provider's guidance on water protection."}],"key":"Tympanostomy tubes ventilate the middle ear. Report drainage. They usually fall out on their own.","id":87,"system":"Ear"},{"topic":"Otitis Media","type":"mc","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"A client with chronic otitis media has foul-smelling ear drainage and worsening hearing. Otoscopic exam shows a pearly white mass behind a perforated tympanic membrane. Which treatment does the nurse anticipate?","case":null,"options":[{"t":"Surgical removal of the mass","c":true,"r":"This describes a cholesteatoma, which can erode the ossicles and nearby bone. It requires surgery."},{"t":"Ear irrigation to wash out the mass","c":false,"r":"Irrigation is contraindicated with a perforated eardrum and will not remove a cholesteatoma."},{"t":"Earwax emulsifying drops","c":false,"r":"Emulsifiers are for cerumen and are contraindicated with a perforation."},{"t":"Watchful waiting for 72 hours","c":false,"r":"Watchful waiting applies to some acute OM, not to a cholesteatoma."}],"key":"Cholesteatoma: chronic OM, foul drainage, hearing loss, white mass. Treated surgically, sometimes with tympanoplasty.","id":88,"system":"Ear"},{"topic":"External Otitis","type":"mc","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"Which assessment finding best helps the nurse tell external otitis apart from acute otitis media?","case":null,"options":[{"t":"Pain when the auricle is moved or the tragus is pressed","c":true,"r":"Pain with movement of the outer ear points to inflammation of the ear canal."},{"t":"Fever","c":false,"r":"Fever can occur with both conditions."},{"t":"A feeling of fullness in the ear","c":false,"r":"Both conditions can cause fullness or muffled hearing."},{"t":"Decreased hearing","c":false,"r":"Both can reduce hearing."}],"key":"Tug the ear or press the tragus. Pain means external otitis.","id":89,"system":"Ear"},{"topic":"External Otitis","type":"sata","need":"Health Promotion and Maintenance","cj":"Generate Solutions","stem":"A competitive swimmer has recurrent external otitis. Which prevention measures should the nurse teach? Select all that apply.","case":null,"options":[{"t":"Tilt the head to drain water and dry the outer ear gently after swimming","c":true,"r":"Moisture in the canal promotes bacterial and fungal growth."},{"t":"Use a hair dryer on the lowest setting held well away from the ear","c":true,"r":"Low, gentle heat dries the canal without injury."},{"t":"Avoid cleaning the ears with cotton-tipped applicators","c":true,"r":"Swabs scratch the canal and remove protective cerumen."},{"t":"Clean earplugs and other in-ear devices regularly","c":true,"r":"Dirty earplugs and hearing aids carry organisms into the canal."},{"t":"Scratch an itchy ear canal with a bobby pin","c":false,"r":"Trauma to the canal skin opens the door to infection."},{"t":"Leave water in the ears so the canal does not dry out","c":false,"r":"Trapped moisture is the main cause of swimmer's ear."}],"key":"Swimmer's ear prevention: keep ears dry, put nothing in the canal, keep devices clean.","id":90,"system":"Ear"},{"topic":"External Otitis","type":"mc","need":"Pharmacological Therapies","cj":"Evaluate Outcomes","stem":"A client with external otitis is prescribed antibiotic-corticosteroid ear drops. Which statement indicates a need for further teaching?","case":null,"options":[{"t":"“I'll touch the dropper tip to my ear so none of the medicine is wasted.”","c":true,"r":"Touching the tip contaminates the bottle. The tip is kept clean and away from the ear."},{"t":"“I'll lie on my side for 3 to 5 minutes after putting in the drops.”","c":false,"r":"Correct. This lets the medication reach the canal."},{"t":"“I'll warm the bottle in my hands before using it.”","c":false,"r":"Correct. Body-temperature drops prevent dizziness."},{"t":"“I'll call if my ear isn't getting better in 2 days.”","c":false,"r":"Correct. Improvement is expected within 48 hours."}],"key":"Otic drops: warm in the hands, clean tip, side-lying 3 to 5 minutes, expect improvement within 48 hours.","id":91,"system":"Ear"},{"topic":"Cerumen & Foreign Bodies","type":"sata","need":"Reduction of Risk Potential","cj":"Take Action","stem":"The nurse is preparing to irrigate the ear of a client with cerumen impaction. Which actions are appropriate? Select all that apply.","case":null,"options":[{"t":"Inspect the ear with an otoscope first to check the tympanic membrane","c":true,"r":"Irrigation is contraindicated with a perforated eardrum."},{"t":"Use solution warmed to body temperature","c":true,"r":"Cold or hot solution stimulates the inner ear and causes vertigo and nausea."},{"t":"Aim the stream toward the top of the canal instead of straight at the eardrum","c":true,"r":"This lets fluid flow behind the wax and protects the eardrum."},{"t":"Use high pressure to remove the wax quickly","c":false,"r":"High pressure can rupture the eardrum."},{"t":"Stop the procedure if the client reports pain or dizziness","c":true,"r":"These symptoms may signal injury or inner ear stimulation."}],"key":"Ear irrigation: check the eardrum first, body-temperature solution, gentle stream aimed upward, stop for pain or dizziness.","id":92,"system":"Ear"},{"topic":"Cerumen & Foreign Bodies","type":"mc","need":"Safety and Infection Control","cj":"Take Action","stem":"A client arrives at urgent care stating a live insect flew into the ear and is buzzing. What does the nurse anticipate first?","case":null,"options":[{"t":"Instilling mineral oil or lidocaine drops to kill the insect before removal","c":true,"r":"Killing the insect stops movement and further injury. Removal is then done under magnification."},{"t":"Irrigating the ear with cold water to flush the insect out","c":false,"r":"Cold water causes vertigo, and the insect has not been killed first."},{"t":"Grasping blindly in the canal with forceps","c":false,"r":"Objects that cannot be seen are not grasped blindly because they can be pushed deeper."},{"t":"Having the client use a cotton swab to coax the insect out","c":false,"r":"Swabs push objects deeper and can injure the eardrum."}],"key":"Insect in the ear: kill it first with oil or lidocaine, then remove it under direct vision.","id":93,"system":"Ear"},{"topic":"Hearing Loss","type":"sata","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"Which conditions cause conductive hearing loss? Select all that apply.","case":null,"options":[{"t":"Cerumen impaction","c":true,"r":"Wax blocks sound from reaching the eardrum."},{"t":"Fluid in the middle ear","c":true,"r":"Effusion dampens movement of the eardrum and ossicles."},{"t":"Damage to the middle ear bones","c":true,"r":"Ossicle problems keep sound from being carried to the inner ear."},{"t":"Age-related hearing loss (presbycusis)","c":false,"r":"Presbycusis is sensorineural, involving the cochlea and auditory nerve."},{"t":"Ototoxic medications","c":false,"r":"Ototoxic drugs damage inner ear hair cells, causing sensorineural loss."},{"t":"Years of loud noise exposure","c":false,"r":"Noise damages cochlear hair cells, causing sensorineural loss."}],"key":"Conductive: outer or middle ear, often medically treatable. Sensorineural: inner ear or nerve, usually permanent, managed with hearing aids. Mixed: both.","id":94,"system":"Ear"},{"topic":"Hearing Loss","type":"sata","need":"Pharmacological Therapies","cj":"Recognize Cues","stem":"A client is receiving IV gentamicin and IV furosemide. Which findings suggest ototoxicity? Select all that apply.","case":null,"options":[{"t":"Ringing in the ears","c":true,"r":"Tinnitus is often the first sign of ototoxicity."},{"t":"Difficulty hearing conversation","c":true,"r":"Hearing loss results from damage to cochlear hair cells."},{"t":"Dizziness and an unsteady gait","c":true,"r":"Vestibular damage causes vertigo and balance problems."},{"t":"Pain when the tragus is pressed","c":false,"r":"This suggests external otitis."},{"t":"Purulent drainage from the ear canal","c":false,"r":"This suggests infection, not drug toxicity."}],"key":"Ototoxic drugs include aminoglycosides, loop diuretics, some chemotherapy, and high-dose aspirin. Watch for tinnitus, hearing loss, and vertigo.","id":95,"system":"Ear"},{"topic":"Hearing Loss","type":"sata","need":"Psychosocial Integrity","cj":"Take Action","stem":"A client has severe hearing loss in the right ear and wears a hearing aid in the left ear. Which actions by the nurse improve communication? Select all that apply.","case":null,"options":[{"t":"Face the client directly in a well-lit area","c":true,"r":"The client relies on lip reading and facial cues."},{"t":"Position yourself on the client's left side","c":true,"r":"Speak toward the better-hearing ear."},{"t":"Rephrase the sentence if the client does not understand","c":true,"r":"Different words may be easier to hear and lip read."},{"t":"Shout so the client can hear clearly","c":false,"r":"Shouting distorts speech and raises pitch, which is harder to understand."},{"t":"Turn off the television before talking","c":true,"r":"Background noise interferes with hearing, especially with hearing aids."},{"t":"Exaggerate mouth movements when speaking","c":false,"r":"Exaggeration distorts lip patterns. Speak normally and clearly."}],"key":"Hearing impairment: face the client, light on your face, better ear, rephrase instead of repeating, reduce noise, normal voice, write difficult words.","id":96,"system":"Ear"},{"topic":"Hearing Loss","type":"sata","need":"Basic Care and Comfort","cj":"Generate Solutions","stem":"The nurse is teaching an older adult who just received a hearing aid. Which instructions should be included? Select all that apply.","case":null,"options":[{"t":"Remove the hearing aid before showering or swimming","c":true,"r":"Water damages the device."},{"t":"Turn the hearing aid off and open the battery door when not in use","c":true,"r":"This saves battery life."},{"t":"Wipe the hearing aid with a soft, dry cloth daily","c":true,"r":"Keeps the device clean without moisture damage."},{"t":"Start by wearing it in quiet settings and gradually increase use","c":true,"r":"Gradual use helps the client adjust to amplified sound."},{"t":"Store the hearing aid in the bathroom where it stays warm","c":false,"r":"Humidity damages hearing aids. Store in a cool, dry place."},{"t":"Expect the hearing aid to restore normal hearing","c":false,"r":"Hearing aids amplify sound but do not restore normal hearing."}],"key":"Hearing aids: keep dry, battery door open when off, clean daily, start in quiet settings, set realistic expectations.","id":97,"system":"Ear"},{"topic":"Hearing Loss","type":"mc","need":"Physiological Adaptation","cj":"Analyze Cues","stem":"An audiogram shows a client's hearing threshold is 60 dB HL. How does the nurse classify this hearing loss?","case":null,"options":[{"t":"Moderately severe","c":true,"r":"56 to 70 dB HL is moderately severe."},{"t":"Mild","c":false,"r":"Mild is 26 to 40 dB HL."},{"t":"Moderate","c":false,"r":"Moderate is 41 to 55 dB HL."},{"t":"Profound","c":false,"r":"Profound is 91 dB HL or greater."}],"key":"Slight 16 to 25 · mild 26 to 40 · moderate 41 to 55 · moderately severe 56 to 70 · severe 71 to 90 · profound 91+.","id":98,"system":"Ear"},{"topic":"Otic Medications","type":"mc","need":"Pharmacological Therapies","cj":"Take Action","stem":"The nurse is giving prescribed ear drops to a 2-year-old. How should the nurse position the ear?","case":null,"options":[{"t":"Pull the pinna down and back","c":true,"r":"In children under 3 the ear canal points upward, so pulling down and back straightens it."},{"t":"Pull the pinna up and back","c":false,"r":"This is the technique for adults and children older than 3."},{"t":"Pull the earlobe straight forward","c":false,"r":"This does not straighten the canal."},{"t":"Insert the dropper tip into the canal to deliver the drops","c":false,"r":"The tip should not touch the canal, which prevents contamination and injury."}],"key":"Under 3: down and back. Adults: up and back. Warm the drops first.","id":99,"system":"Ear"},{"topic":"Otic Medications","type":"sata","need":"Pharmacological Therapies","cj":"Generate Solutions","stem":"A client plans to use carbamide peroxide drops to soften earwax. Which instructions should the nurse include? Select all that apply.","case":null,"options":[{"t":"Do not use the drops if you have ear pain, drainage, or a hole in the eardrum","c":true,"r":"Emulsifiers can reach the middle ear through a perforation and cause damage or infection."},{"t":"Keep the head tilted for several minutes after instilling the drops","c":true,"r":"This keeps the solution in the canal to soften the wax."},{"t":"A bubbling or fizzing sound is expected","c":true,"r":"The peroxide releases oxygen as it works."},{"t":"Do not use the drops for more than 4 days unless your provider says to","c":true,"r":"Prolonged use irritates the canal. Wax that persists needs evaluation."},{"t":"Use a cotton-tipped swab afterward to remove the softened wax","c":false,"r":"Swabs push wax deeper and can injure the canal and eardrum."},{"t":"Use the drops daily long term to prevent wax buildup","c":false,"r":"Emulsifiers are for short-term use."}],"key":"Earwax emulsifiers: short term, intact eardrum only, no swabs afterward.","id":100,"system":"Ear"}]</script>
<script>
(function(){
'use strict';
var QS = JSON.parse(document.getElementById('qdata').textContent);
var BY = {}; QS.forEach(function(q){ BY[q.id] = q; });
var SYS_ORDER = ['Neuro','Eye','Ear'];
var SYS_LABEL = {Neuro:'Neurological disorders', Eye:'Eye disorders', Ear:'Ear disorders'};
var TOPICS = {}; SYS_ORDER.forEach(function(s){ TOPICS[s] = []; });
var TCOUNT = {};
QS.forEach(function(q){ if(!TCOUNT[q.topic]){ TCOUNT[q.topic] = 0; TOPICS[q.system].push(q.topic); } TCOUNT[q.topic]++; });
var ALL_TOPICS = [].concat(TOPICS.Neuro, TOPICS.Eye, TOPICS.Ear);
var CJ_ORDER = ['Recognize Cues','Analyze Cues','Prioritize Hypotheses','Generate Solutions','Take Action','Evaluate Outcomes'];
var LETTERS = 'ABCDEF';
var LS_KEY = 'ns-nclex-exam-v1';
var SEC_PER_Q = 90;

var S = {
  view: 'home',
  prefs: { mode:'practice', topics: ALL_TOPICS.slice(), qtype:'all', count:'all', shuffleQ:true, shuffleA:true, timed:true },
  session: null,
  history: {},
  drawer: false,
  confirm: null,
  reviewList: null,
  reviewPos: 0,
  reviewFilter: 'all'
};

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtTime(ms){ ms = Math.max(0, ms); var s = Math.round(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : String(m)) + ':' + String(x).padStart(2,'0'); }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function band(p){ return p >= 80 ? 'ok' : (p >= 60 ? 'part' : 'bad'); }

/* ── storage ── */
function persist(){
  try {
    if (S.session && S.session.running) syncClock();
    localStorage.setItem(LS_KEY, JSON.stringify({ prefs:S.prefs, session:S.session, history:S.history }));
  } catch(e){}
}
function restore(data){
  var d = data;
  if (!d){ try { var raw = localStorage.getItem(LS_KEY); d = raw ? JSON.parse(raw) : null; } catch(e){ d = null; } }
  if (!d) return;
  if (d.prefs){ for (var k in S.prefs){ if (d.prefs[k] !== undefined) S.prefs[k] = d.prefs[k]; } S.prefs.topics = (S.prefs.topics||[]).filter(function(t){ return TCOUNT[t]; }); }
  if (d.history) S.history = d.history;
  if (d.session && d.session.ids && d.session.ids.every(function(id){ return BY[id]; })) { S.session = d.session; S.session.running = false; }
  if (d.view && S.session) { S.view = d.view; if (d.reviewList) { S.reviewList = d.reviewList; S.reviewPos = d.reviewPos||0; S.reviewFilter = d.reviewFilter||'all'; } }
}

/* ── scoring ── */
function scoreQ(q, sel){
  sel = sel || [];
  var correct = []; q.options.forEach(function(o,i){ if (o.c) correct.push(i); });
  var set = {}; sel.forEach(function(i){ set[i] = true; });
  var exact = correct.length === sel.length && correct.every(function(i){ return set[i]; });
  var pts, max;
  if (q.type === 'mc'){ max = 1; pts = exact ? 1 : 0; }
  else { max = correct.length; var p = 0; sel.forEach(function(i){ p += q.options[i].c ? 1 : -1; }); pts = Math.max(0, p); }
  return { exact: exact, pts: pts, max: max, answered: sel.length > 0 };
}

/* ── pool from prefs ── */
function pool(){
  var tp = {}; S.prefs.topics.forEach(function(t){ tp[t] = true; });
  return QS.filter(function(q){ return tp[q.topic] && (S.prefs.qtype === 'all' || q.type === S.prefs.qtype); }).map(function(q){ return q.id; });
}
function plannedCount(){
  var n = pool().length;
  if (S.prefs.count === 'all') return n;
  return Math.min(n, +S.prefs.count);
}
function missedIds(){ return QS.filter(function(q){ var h = S.history[q.id]; return h && h.last === false; }).map(function(q){ return q.id; }); }

/* ── sessions ── */
function newSession(mode, ids){
  var order = S.prefs.shuffleQ ? shuffle(ids) : ids.slice().sort(function(a,b){ return a-b; });
  if (S.prefs.count !== 'all' && !S._forceAll) order = order.slice(0, +S.prefs.count);
  S._forceAll = false;
  var optOrder = {};
  order.forEach(function(id){ var n = BY[id].options.length, base = []; for (var i=0;i<n;i++) base.push(i); optOrder[id] = S.prefs.shuffleA ? shuffle(base) : base; });
  S.session = {
    mode: mode, ids: order, optOrder: optOrder, answers: {}, revealed: {}, flagged: {}, idx: 0,
    elapsed: 0, limit: (mode === 'exam' && S.prefs.timed) ? order.length * SEC_PER_Q * 1000 : null,
    finished: false, running: false, startedAt: Date.now()
  };
  S.view = 'quiz'; S.drawer = false; S.confirm = null;
  startClock();
  persist(); render(); window.scrollTo(0,0);
}
var tickHandle = null, clockMark = 0;
function startClock(){ if (!S.session || S.session.finished) return; S.session.running = true; clockMark = Date.now(); if (!tickHandle) tickHandle = setInterval(tick, 1000); }
function syncClock(){ if (S.session && S.session.running){ var now = Date.now(); S.session.elapsed += now - clockMark; clockMark = now; } }
function stopClock(){ syncClock(); if (S.session) S.session.running = false; if (tickHandle){ clearInterval(tickHandle); tickHandle = null; } }
function tick(){
  if (!S.session || S.view !== 'quiz'){ return; }
  syncClock();
  var el = document.getElementById('clock');
  if (el) { var t = clockText(); el.textContent = t.text; el.className = 'clock' + (t.low ? ' low' : ''); }
  if (S.session.limit && S.session.elapsed >= S.session.limit){ finishSession(); }
  if (S.session && (S.session.elapsed % 15000) < 1000) persist();
}
function clockText(){
  var s = S.session;
  if (s.limit){ var left = s.limit - s.elapsed; return { text: fmtTime(left) + ' left', low: left < 5*60*1000 }; }
  return { text: fmtTime(s.elapsed), low:false };
}
function curId(){ return S.session.ids[S.session.idx]; }

function finishSession(){
  var s = S.session; if (!s) return;
  stopClock();
  s.finished = true; s.finishedAt = Date.now();
  s.ids.forEach(function(id){
    var counted = s.mode === 'exam' || s.revealed[id];
    if (!counted) return;
    if (s.mode === 'practice') return; // practice history recorded on submit
    var r = scoreQ(BY[id], s.answers[id]);
    var h = S.history[id] || { seen:0, correct:0 };
    h.seen++; if (r.exact) h.correct++; h.last = r.exact; S.history[id] = h;
  });
  S.view = 'results'; S.drawer = false; S.confirm = null;
  persist(); render(); window.scrollTo(0,0);
}

/* ── render helpers ── */
function optStateClass(o, chosen, revealed){
  if (!revealed) return '';
  if (o.c && chosen) return 's-hit';
  if (o.c && !chosen) return 's-miss';
  if (!o.c && chosen) return 's-wrong';
  return 's-skip';
}
function verdictText(o, chosen){
  if (o.c && chosen) return 'Correct choice';
  if (o.c && !chosen) return 'Missed · this option is correct';
  if (!o.c && chosen) return 'Incorrect choice';
  return 'Correctly left unselected';
}
function renderCase(c){
  if (!c) return '';
  return '<section class="case" aria-label="Client record"><div class="case-h"><span>' + esc(c.title) + '</span></div><dl>' +
    c.rows.map(function(r){ return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl></section>';
}
function stemText(q){ return q.stem.replace(/\s*Select all that apply\.?\s*$/,''); }

function renderQuestionCard(id, num, total, revealed){
  var q = BY[id], s = S.session, sel = s.answers[id] || [], set = {};
  sel.forEach(function(i){ set[i] = true; });
  var order = s.optOrder[id];
  var isMC = q.type === 'mc';
  var out = '<article class="qcard" aria-live="polite">';
  out += '<div class="qmeta"><span class="qnum">' + num + '.</span><span class="tag topic">' + esc(q.topic) + '</span><span class="tag">' + esc(q.need) + '</span><span class="tag">' + esc(q.cj) + '</span>' + (s.flagged[id] ? '<span class="tag flagged">Flagged</span>' : '') + '</div>';
  out += renderCase(q.case);
  out += '<p class="stem">' + esc(stemText(q)) + '</p>';
  out += '<p class="instr"><span class="k">' + (isMC ? 'MC' : 'SATA') + '</span>' + (isMC ? 'Select one answer.' : 'Select all that apply.') + '</p>';
  out += '<div class="opts" role="' + (isMC ? 'radiogroup' : 'group') + '">';
  order.forEach(function(oi, pos){
    var o = q.options[oi], chosen = !!set[oi], st = optStateClass(o, chosen, revealed);
    out += '<button type="button" class="opt ' + (isMC ? 'mc ' : '') + (revealed ? 'locked ' : '') + st + '" role="' + (isMC ? 'radio' : 'checkbox') + '" aria-checked="' + (chosen ? 'true' : 'false') + '"' + (revealed ? ' aria-disabled="true"' : '') + ' data-act="opt" data-i="' + oi + '">';
    out += '<span class="box" aria-hidden="true"></span><span class="let">' + LETTERS[pos] + '</span><span class="txt"><span>' + esc(o.t) + '</span>';
    if (revealed) out += '<span class="verdict">' + verdictText(o, chosen) + '</span><span class="why">' + esc(o.r) + '</span>';
    out += '</span></button>';
  });
  out += '</div>';
  if (revealed){
    var r = scoreQ(q, sel);
    var cls = !r.answered ? 'none' : (r.exact ? 'ok' : (r.pts > 0 ? 'part' : 'bad'));
    var label = !r.answered ? 'Not answered' : (r.exact ? 'Correct' : (r.pts > 0 ? 'Partially correct' : 'Incorrect'));
    var nCorrect = q.options.filter(function(o){ return o.c; }).length;
    out += '<div class="result ' + cls + '"><h3>' + label + '</h3><span class="pts">' + (isMC ? 'Score ' + r.pts + ' of 1' : 'NGN +/- score ' + r.pts + ' of ' + r.max + ' · ' + nCorrect + ' correct option' + (nCorrect === 1 ? '' : 's')) + '</span></div>';
    out += '<div class="key"><span class="kl">Key takeaway</span><p>' + esc(q.key) + '</p></div>';
  }
  out += '</article>';
  return out;
}

/* ── views ── */
function renderHome(){
  var p = S.prefs, n = plannedCount(), poolN = pool().length, missed = missedIds();
  var s = S.session;
  var h = '';
  h += '<header class="mast"><div class="wrap mast-in"><div class="mast-copy"><p class="eyebrow">Module 2 · Neurological &amp; Sensory Alterations</p><h1>Neuro &amp; Sensory NCLEX Exam</h1>';
  h += '<p class="lede">100 Next Generation NCLEX-style items built from your Neurological Disorders and Sensory Disorders decks and unit outcomes. Every option has its own rationale.</p></div>';
  h += '<div class="amsler" role="img" aria-label="100 items: 60 select all that apply, 40 multiple choice"><div class="am-stat"><b>100</b><span>items</span></div><div class="am-stat"><b>60</b><span>select all<br>that apply</span></div><div class="am-stat"><b>40</b><span>multiple<br>choice</span></div><i class="am-dot"></i></div>';
  h += '</div></header><main class="wrap home">';
  if (s && !s.finished){
    var answered = s.ids.filter(function(id){ return (s.answers[id]||[]).length; }).length;
    h += '<div class="resume"><p><strong>' + (s.mode === 'exam' ? 'Exam' : 'Practice') + ' in progress.</strong> ' + answered + ' of ' + s.ids.length + ' answered · ' + fmtTime(s.elapsed) + ' elapsed</p><div class="row"><button class="btn primary" data-act="resume">Resume</button><button class="btn ghost small" data-act="discard">Discard</button></div></div>';
  } else if (s && s.finished){
    h += '<div class="resume"><p><strong>Last ' + (s.mode === 'exam' ? 'exam' : 'practice') + ' finished.</strong> Your score report and rationales are still here.</p><div class="row"><button class="btn primary" data-act="toresults">View results</button></div></div>';
  }
  h += '<section class="panel"><h2 class="sec"><small>Step 1</small>Choose a mode</h2><div class="modes">';
  h += '<button class="mode-card" data-act="mode" data-v="practice" aria-pressed="' + (p.mode === 'practice') + '"><span class="mode-name">Practice mode</span><span class="mode-desc">Submit each answer and read why every option is right or wrong before moving on.</span><ul class="mode-feats"><li>Instant rationales</li><li>Untimed</li><li>Retry misses</li></ul></button>';
  h += '<button class="mode-card" data-act="mode" data-v="exam" aria-pressed="' + (p.mode === 'exam') + '"><span class="mode-name">Exam mode</span><span class="mode-desc">Work through the set like test day. Rationales for every answer appear in your score report.</span><ul class="mode-feats"><li>Optional time limit</li><li>Flag and return</li><li>Score by topic</li></ul></button>';
  h += '</div></section>';
  h += '<section class="panel"><h2 class="sec"><small>Step 2</small>Pick your content</h2>';
  SYS_ORDER.forEach(function(sys){
    var on = TOPICS[sys].filter(function(t){ return p.topics.indexOf(t) >= 0; }).length;
    var total = TOPICS[sys].reduce(function(a,t){ return a + TCOUNT[t]; }, 0);
    h += '<div class="sys"><div class="sys-head"><h3>' + SYS_LABEL[sys] + '</h3><span class="sys-count">' + total + ' items</span><button class="linkbtn" data-act="sysall" data-v="' + sys + '">' + (on === TOPICS[sys].length ? 'Clear' : 'Select all') + '</button></div><div class="chips">';
    TOPICS[sys].forEach(function(t){ h += '<button class="chip-t" data-act="topic" data-v="' + esc(t) + '" aria-pressed="' + (p.topics.indexOf(t) >= 0) + '">' + esc(t) + '<span class="n">' + TCOUNT[t] + '</span></button>'; });
    h += '</div></div>';
  });
  h += '<div class="row">';
  h += '<div class="field"><span class="flabel">Question type</span><div class="seg" role="group" aria-label="Question type">' +
       [['all','All'],['sata','SATA only'],['mc','Multiple choice only']].map(function(o){ return '<button data-act="qtype" data-v="' + o[0] + '" aria-pressed="' + (p.qtype === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>';
  h += '<div class="field"><span class="flabel">How many</span><div class="seg" role="group" aria-label="Number of questions">' +
       [['10','10'],['25','25'],['50','50'],['all','All']].map(function(o){ return '<button data-act="count" data-v="' + o[0] + '" aria-pressed="' + (p.count === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>';
  h += '</div><div class="row">';
  h += '<button class="toggle" role="switch" data-act="pref" data-v="shuffleQ" aria-checked="' + p.shuffleQ + '"><span class="sw"></span>Shuffle question order</button>';
  h += '<button class="toggle" role="switch" data-act="pref" data-v="shuffleA" aria-checked="' + p.shuffleA + '"><span class="sw"></span>Shuffle answer options</button>';
  if (p.mode === 'exam') h += '<button class="toggle" role="switch" data-act="pref" data-v="timed" aria-checked="' + p.timed + '"><span class="sw"></span>Time limit (90 sec per question)</button>';
  h += '</div></section>';
  h += '<div class="startbar"><button class="btn primary big" data-act="start"' + (n ? '' : ' disabled') + '>Start ' + (p.mode === 'exam' ? 'exam' : 'practice') + ' · ' + n + ' question' + (n === 1 ? '' : 's') + '</button>';
  if (missed.length) h += '<button class="btn" data-act="startmissed">Practice my ' + missed.length + ' missed</button>';
  if (!n) h += '<span class="hint">Pick at least one topic to begin.</span>';
  else if (p.mode === 'exam' && p.timed) h += '<span class="hint">Time limit ' + fmtTime(n*SEC_PER_Q*1000) + '</span>';
  else if (poolN !== n) h += '<span class="hint">Random ' + n + ' of ' + poolN + ' matching items</span>';
  h += '</div>';
  h += '<section class="note"><p><b>How SATA is scored here.</b> An item counts as correct only when your selections match the key exactly. You also get the NGN <span class="mono">+/-</span> score: +1 for each correct option you pick, minus 1 for each wrong one, never below 0. That shows partial credit the way the NGN does.</p><p><b>Keyboard.</b> Press A to F (or 1 to 6) to pick options, Enter to submit or move on, and the arrow keys to go back and forth.</p></section>';
  var seen = Object.keys(S.history).length;
  if (seen){
    h += '<div class="reset-row"><span>' + seen + ' of 100 items attempted across sessions.</span>';
    if (S.confirm === 'reset') h += '<span>Clear all saved progress?</span><button class="btn small" data-act="resetyes">Yes, clear it</button><button class="btn small ghost" data-act="cancelconfirm">Keep it</button>';
    else h += '<button class="linkbtn" data-act="reset">Reset progress</button>';
    h += '</div>';
  }
  h += '</main>';
  return h;
}

function renderBar(title, extra){
  var s = S.session;
  return '<div class="bar"><div class="wrap-wide bar-in">' + title + '<span class="spacer"></span>' + (extra||'') + '</div>' +
    '<div class="progress"><i style="width:' + (S.view === 'review' ? pct(S.reviewPos+1, S.reviewList.length) : pct(s.idx+1, s.ids.length)) + '%"></i></div></div>';
}

function renderQuiz(){
  var s = S.session, id = curId(), q = BY[id], isPractice = s.mode === 'practice';
  var revealed = isPractice && !!s.revealed[id];
  var sel = s.answers[id] || [];
  var title = '<span class="pill ' + (isPractice ? '' : 'exam') + '">' + (isPractice ? 'Practice' : 'Exam') + '</span><span class="qcount"><span class="ql">Question </span><b>' + (s.idx+1) + '</b> of ' + s.ids.length + '</span>';
  var extra = '';
  if (isPractice){
    var done = s.ids.filter(function(x){ return s.revealed[x]; }), right = done.filter(function(x){ return scoreQ(BY[x], s.answers[x]).exact; }).length;
    extra += '<span class="tally">' + right + '/' + done.length + ' correct</span>';
  }
  var t = clockText();
  extra += '<span id="clock" class="clock' + (t.low ? ' low' : '') + '">' + t.text + '</span>';
  extra += '<button class="btn small" data-act="drawer">Questions</button><button class="btn small ghost" data-act="exit"><span class="lg">Save &amp; exit</span><span class="sm">Exit</span></button>';
  var h = renderBar(title, extra);
  h += '<main class="wrap quiz">' + renderQuestionCard(id, s.idx+1, s.ids.length, revealed) + '</main>';
  h += '<div class="actions"><div class="wrap actions-in">';
  h += '<button class="btn" data-act="prev"' + (s.idx === 0 ? ' disabled' : '') + '>Back</button>';
  if (!isPractice) h += '<button class="btn flagbtn" data-act="flag" aria-pressed="' + !!s.flagged[id] + '">' + (s.flagged[id] ? 'Flagged' : 'Flag') + '</button>';
  h += '<span class="spacer"></span><span class="kbd-hint">A to F select · Enter ' + (isPractice && !revealed ? 'submit' : 'next') + '</span>';
  var last = s.idx === s.ids.length - 1;
  if (isPractice){
    if (!revealed) h += '<button class="btn primary" data-act="submit"' + (sel.length ? '' : ' disabled') + '>Submit answer</button>';
    else h += '<button class="btn primary" data-act="' + (last ? 'drawer' : 'next') + '">' + (last ? 'Finish' : 'Next question') + '</button>';
  } else {
